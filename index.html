function parseAnswer(raw,panel=PRACTICE_PANEL) {

  if ((text.split(/[.,]/)[1]||"").length>2) return {value:null,error:"Use up to two decimal places.",valid:false};
  const value=Number(text.replace(",",".")),min=panel.min??SETTINGS.min,max=panel.max??SETTINGS.max;
  if (!Number.isFinite(value)||Math.abs(value)>Number.MAX_SAFE_INTEGER/100) return {value:null,error:"Enter a finite amount that can be recorded to two decimal places.",valid:false};
  if (!panel.money&&(value<min||value>max)) return {value:null,error:`Enter a value between ${format(min)} and +${format(max)}.`,valid:false};
  if (Math.abs(value*100-Math.round(value*100))>0.000001) return {value:null,error:"Use up to two decimal places.",valid:false};

}
function plotRange(panel,raw) {

    const bound=Math.max(max,...amounts);
    if(bound<=max)return {min,max,tick};
    const magnitude=10**Math.floor(Math.log10(bound/2));
    tick=[1,2,5,10].map(v=>v*magnitude).find(v=>v>=bound/2)||10*magnitude;
    max=tick*2;min=-max;
  }
  return {min,max,tick};
}

  if(id==="welcome") {
    screen.innerHTML=`<div class="kicker">About the study</div><h1>Predict how income instability affects mental health and household consumption.</h1><p>The study has been completed. We ask you to predict its results.</p><ul class="study-facts"><li><strong>Who and where:</strong> 2,272 women in northern Ghana.</li><li><strong>When:</strong> During the lean season.</li><li><strong>The work:</strong> Stitching bags at home, with flexible hours. Pilot experience suggests about 50–70 minutes per bag: roughly 12.5–17.5 hours for 15 bags. In the pilot, the first five bags were picked up after 48 hours.</li><li><strong>Pay:</strong> GHC 12 per completed bag that met the quality standard, the same across treatment arms. Payment was made at pickup after the bags were checked.</li><li><strong>Assignment:</strong> Random assignment to Control or one of three treatment arms.</li></ul><p>The study was divided into six 2-week periods. The treatment arms differed in whether the number of bags varied across periods and, if so, whether those fluctuations were predictable.</p><div class="grid-wrap"><table class="design-table"><caption>Compare the four study arms</caption><thead><tr><th scope="col">Arm</th><th scope="col">Bags per period</th><th scope="col">Study income per period</th><th scope="col">What is known in advance?</th></tr></thead><tbody><tr><th scope="row">Control</th><td>No study work</td><td>GHC 0 from study work</td><td>—</td></tr><tr><th scope="row">Stable</th><td>9 every period</td><td><strong>GHC 108</strong> every period</td><td>Full 6-period schedule</td></tr><tr><th scope="row">Predictable</th><td>3 in three periods; 15 in three periods</td><td><strong>GHC 36 or 180</strong>, known in advance</td><td>Full 6-period schedule</td></tr><tr><th scope="row">Risky</th><td>3 or 15 each period, with a 50-50 chance</td><td><strong>GHC 36 or 180</strong>, revealed each period</td><td>Only the current period, revealed at its start</td></tr></tbody></table></div><p class="small">Study-income amounts assume all assigned bags are completed and pass the quality check; survey compensation is separate. The three treatment arms had the same expected total work and earnings over the six periods. In the Risky arm, realized totals could differ from their expected values.</p>${implementationHTML()}<details><summary>More about the work schedules</summary><p>Stable and Predictable schedules were explained at the beginning, with comprehension questions. Predictable participants were randomly assigned among 20 possible orders of three high-work and three low-work periods; the order was not fixed across everyone. In Risky, participants scratched a scratchcard at the start of each period to reveal the work assignment.</p></details><details><summary>About this prediction demo</summary><p>This demonstration lets you try the prediction questions. Answers stay in this browser tab and can be downloaded. Continuing starts the demo; it does not submit research consent or send responses to the study team.</p></details>`;

function svgElement(tag,attrs,parent,text) {
  const node=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const [key,value] of Object.entries(attrs||{})) node.setAttribute(key,value);
  if(text!==undefined) node.textContent=text;
  parent.appendChild(node);return node;
}
function drawShape(parent,series,x,y,fill) {
  const attrs={fill,stroke:series.stroke,"stroke-width":2};
  if(series.shape==="circle") return svgElement("circle",{...attrs,cx:x,cy:y,r:7},parent);
  if(series.shape==="square") return svgElement("rect",{...attrs,x:x-7,y:y-7,width:14,height:14},parent);
  if(series.shape==="triangle") return svgElement("polygon",{...attrs,points:`${x},${y-9} ${x-9},${y+7} ${x+9},${y+7}`},parent);
  return svgElement("polygon",{...attrs,points:`${x},${y-9} ${x-8},${y} ${x},${y+9} ${x+8},${y}`},parent);
}

function drawPlot(target,panel,raw,interactive,onChange) {

  const width=Math.max(240,target.clientWidth),height=370,left=Math.min(210,Math.max(88,width*.24)),right=width,top=70,bottom=335;
  const container=target.parentElement,compact=width<560,filterComparisons=compact&&panelWindows(panel).length>1;

  container.querySelectorAll('.estimate-table tbody tr').forEach((row,i)=>row.classList.toggle('graph-selected',filterComparisons&&i===selected));
  drawLegend(document.getElementById(panel.id+'_legend'),filterComparisons?[panel.series[selected]]:panel.series);
  const {min,max,tick}=plotRange(panel,raw);
  const windows=panelWindows(panel);
  const y=value=>bottom-(value-min)/(max-min)*(bottom-top);
  const svg=svgElement("svg",{viewBox:`0 0 ${width} ${height}`,role:"group","aria-label":panel.section||panel.title||"Assigned study income"},target);
  if(panel.unit&&!compact) svgElement("text",{transform:`translate(${left-68} ${(top+bottom)/2}) rotate(-90)`,"text-anchor":"middle","font-size":11,fill:"#596b79"},svg,panel.unit);

function mountAnswerInterface(panel,raw,onUpdate) {

function feedbackSummaryHTML() {
  if(!state.feedback)return "";
  return '<section class="summary-card"><h2>Is there anything we missed?</h2><p class="written-answer">'+escapeHTML(state.feedback.text||"No additional comments.")+'</p></section>';
}
function renderFeedback() {
  if(state.feedback){
    screen.innerHTML='<div class="kicker">Additional comments</div><h1>Your comments</h1><p class="locked-note">Answer saved · read-only.</p>'+feedbackSummaryHTML();
    setNavigation("Continue →",advanceInfo,"Your saved comments remain unchanged.");return;
  }
  screen.innerHTML='<div class="kicker">Additional comments</div><h1>Is there anything we missed?</h1><p>Are there other factors we should consider when interpreting the study results, information you would have found helpful, or questions you think we should have asked? Please share any other thoughts or suggestions.</p><label class="field-label" for="generalFeedback">Your comments (optional)</label><textarea id="generalFeedback" rows="10" aria-describedby="feedbackHint">'+escapeHTML(state.feedbackDraft)+'</textarea><p id="feedbackHint" class="small muted">You can leave this blank. There is no word minimum.</p>';
  setNavigation("Continue →",()=>{if(saveFeedback())advanceInfo();},"This question is optional. Your comments are saved before the additional-information page.");
  document.getElementById("generalFeedback").addEventListener("input",event=>{state.feedbackDraft=event.target.value;persist();});
}
function backgroundValid() {
  return BACKGROUND_FIELDS.filter(field=>field.scale).every(field=>state.backgroundDraft[field.id]===""||validImportance(state.backgroundDraft[field.id]));
}
function saveBackground() {
  if(state.browseIndex!==null||state.background||state.phase!=="background"||!backgroundValid())return false;
  state.background={answers:Object.fromEntries(BACKGROUND_FIELDS.map(field=>{
    const value=state.backgroundDraft[field.id].trim();
    return [field.id,value===""?null:field.scale?Number(value):value];
  })),savedAt:new Date().toISOString()};
  return true;
}
function backgroundSummaryHTML() {
  if(!state.background)return "";
  return '<section class="summary-card"><h2>About you and your predictions</h2>'+BACKGROUND_FIELDS.map(field=>{
    const value=state.background.answers[field.id];
    return '<h3>'+escapeHTML(field.label)+'</h3><p>'+escapeHTML(value===null?"Not answered":String(value)+(field.scale?" / 10":""))+'</p>';
  }).join('')+'</section>';
}
function renderBackground() {
  if(state.background){
    screen.innerHTML='<div class="kicker">A few final questions</div><h1>Your background and confidence</h1><p class="locked-note">Answers saved · read-only.</p>'+backgroundSummaryHTML();
    setNavigation("Continue →",advanceInfo,"Your saved answers remain unchanged.");return;
  }
  screen.innerHTML='<div class="kicker">A few final questions</div><h1>About you and your predictions</h1><p>These five short questions help us understand who is making predictions. All are optional; you can leave any blank.</p>'+BACKGROUND_FIELDS.map(field=>'<label class="field-label" for="background-'+field.id+'">'+escapeHTML(field.label)+'</label><input class="text-field" id="background-'+field.id+'" data-background="'+field.id+'" '+(field.scale?'type="number" min="0" max="10" step="1" inputmode="numeric" placeholder="0–10" aria-describedby="hint-'+field.id+'"':'type="text"')+' value="'+escapeHTML(state.backgroundDraft[field.id])+'">'+(field.hint?'<p class="small muted" id="hint-'+field.id+'">'+escapeHTML(field.hint)+'. Enter a whole number.</p>':'')).join('')+'<p id="backgroundStatus" class="answer-status error" role="status"></p>';
  setNavigation("Finish & review answers →",()=>{
    if(!saveBackground())return;
    state.phase="finished";state.finishedAt=new Date().toISOString();persist();render();
  },"All five questions are optional. Your predictions remain locked.",!backgroundValid());
  const update=()=>{
    screen.querySelectorAll('input[data-background]').forEach(input=>{
      const field=BACKGROUND_FIELDS.find(field=>field.id===input.dataset.background);
      input.setAttribute("aria-invalid",field.scale&&input.value!==""&&!validImportance(input.value)?"true":"false");
    });
    document.getElementById("nextButton").disabled=!backgroundValid();
    document.getElementById("backgroundStatus").textContent=backgroundValid()?"":"Use whole numbers from 0 to 10, or leave the rating blank.";
  };
  screen.querySelectorAll('input[data-background]').forEach(input=>input.addEventListener("input",()=>{
    state.backgroundDraft[input.dataset.background]=input.value;persist();update();
  }));
  update();
}
function renderRevisionChoice() {
  if(state.revisionRequested!==null){
    screen.innerHTML=`<div class="kicker">Review your predictions</div><h1>Your revision decision</h1><p class="locked-note"><strong>Decision saved · read-only.</strong></p><p class="lead">${state.revisionRequested?"You chose to revise your answers.":"You chose to keep your first answers."}</p><p>Your first answers remain locked. Going back does not change this decision or start another revision round.</p>`;
    setNavigation("Continue →",advanceInfo,"Your saved revision decision remains unchanged.");return;
  }
  screen.innerHTML=`<div class="kicker">Review your predictions</div><h1>Would you like to revise your first answers?</h1><p class="lead">Your first predictions are locked and saved separately.</p><p>You can inspect them using “First answers” above. Revising reopens the three numerical prediction pages with your existing values. Your mechanism ratings and additional comments remain part of your first response.</p><div class="choice-list"><label class="choice"><input type="radio" name="revise" value="yes"><div><strong>Yes, I would like to revise</strong><span>Keep my first answers and record a second set separately.</span></div></label><label class="choice"><input type="radio" name="revise" value="no"><div><strong>No, keep my first answers</strong><span>Keep my first answers and continue to a few optional questions.</span></div></label></div><p class="choices-foot">If the preceding information page was marked pending, no new study evidence has been shown. This is a test of the revision flow only.</p>`;
  setNavigation("Continue →",()=>{
    const selected=screen.querySelector('input[name="revise"]:checked');if(!selected)return;
    state.revisionRequested=selected.value==="yes";state.revisionChoiceAt=new Date().toISOString();
    state.phase=state.revisionRequested?"revision":"background";state.index=0;
    persist();render();
  },"The revision decision is stored with your first and second answers.",!state.revisionSelection);
  screen.querySelectorAll('input[name="revise"]').forEach(input=>{
    input.checked=input.value===state.revisionSelection;
    input.addEventListener("change",()=>{state.revisionSelection=input.value;persist();document.getElementById("nextButton").disabled=false;});
  });
}

function summaryHTML(includeRevised) {
  let html="";
  enabledPanels.forEach(panel=>{
    if(!state.first[panel.id])return;
    const first=state.first[panel.id].values,revised=state.revised[panel.id]?.values;
    html+=`<section class="summary-card"><h2>${escapeHTML(predictionTag(panel))}</h2>${proposalBadgeHTML(panel)}<p class="small muted">${escapeHTML(panel.section)} · ${escapeHTML(panel.unit)}${panel.draft?" · Proposed comparison":""}</p><div class="grid-wrap"><table class="summary-table"><thead><tr><th>Periods</th><th>Comparison</th><th>First</th>${includeRevised?"<th>Revised</th><th>Final</th>":""}</tr></thead><tbody>`;
    first.forEach((value,i)=>{
      const changed=revised&&revised[i]!==value;
      html+=`<tr${changed?' class="changed"':""}><td data-label="Periods">${panelWindows(panel)[Math.floor(i/panel.series.length)]}</td><td data-label="Comparison">${escapeHTML(panel.series[i%panel.series.length].label)}</td><td data-label="First">${format(value)}</td>${includeRevised?'<td data-label="Revised">'+(revised?format(revised[i]):"—")+'</td><td data-label="Final">'+format(revised?revised[i]:value)+'</td>':""}</tr>`;
    });html+='</tbody></table></div></section>';
  });return html;
}
function exportData() {
  return {
    demo:true,specification:"Revising Sliders 10.12.26.docx",feedback:["Feedback Interface - Oct 14, 2026 LSC vs3.pdf","qualtrics_demo_2026_10_15, HS.pdf","qualtrics_demo_2026_10_15ddw.pdf","PI mtg, 2026.10.19.txt","vip-SSPP Google Doc, October 26 and November 2 tabs, comments reviewed 2026-11-09"],version:SETTINGS.version,
    tutorial_completed_at:state.practice.completedAt,
    general_feedback:state.feedback?{question:"Is there anything we missed?",...state.feedback}:null,
    background:state.background?{...state.background,questions:BACKGROUND_FIELDS}:null,
    additional_information:{provided:!!SETTINGS.additionalInformation.trim(),text:SETTINGS.additionalInformation,seen_at:state.informationSeenAt},
    started_at:state.startedAt,finished_at:state.finishedAt,
    revision_requested:state.revisionRequested,revision_choice_at:state.revisionChoiceAt,
    windows:SETTINGS.windows,
    mental_health_measure:{definition:SETTINGS.mentalHealthDefinition,review_note:SETTINGS.mentalHealthPending},
    consumption_benchmark:{...SETTINGS.benchmark,period:SETTINGS.consumptionPeriod},
    mechanisms:state.mechanisms?{...state.mechanisms,outcome:"mental_health",items:MECHANISMS,comparisons:MECHANISM_PAIRS,scale:IMPORTANCE_SCALE,wording_provisional:true}:null,
    panels:enabledPanels.map(panel=>({id:panel.id,page_id:panel.pageParent||panel.id,document_label:panel.documentLabel||panel.id,title:panel.title,windows:panelWindows(panel),axis:{initial_min:panel.min??SETTINGS.min,initial_max:panel.max??SETTINGS.max,step:panel.step??SETTINGS.step,typed_amounts_expand:!!panel.money},unit:panel.unitCode,unit_label:panel.unit,proposed:!!panel.draft,alternative_version:!!panel.alternative,proposal_version:panel.proposalVersion||null,proposal_label:panel.proposalLabel||null,contrasts:panel.series.map(s=>s.label),definition:panel.explanation,context:panel.context||null,first_saved_at:state.first[panel.id]?.savedAt||null,revised_saved_at:state.revised[panel.id]?.savedAt||null,
      responses:panelWindows(panel).flatMap((window,r)=>panel.series.map((series,s)=>{
        const i=r*panel.series.length+s,first=state.first[panel.id]?.values[i]??null,second=state.revised[panel.id]?.values[i]??null;
        return {window,contrast:series.label,first,revised:second,final:second===null?first:second,changed:second===null?false:second!==first};
      }))
    }))
  };
}
function download(name,content,type) {
  const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvData(data) {
  const rows=[["panel_id","document_label","unit","proposed_contrast","reference_window","comparison","first_answer","revised_answer","final_answer","changed","revision_requested","first_saved_at","revised_saved_at","revision_choice_at","additional_information_provided","additional_information_seen_at","general_feedback","feedback_saved_at",...BACKGROUND_FIELDS.map(field=>field.id),"background_saved_at"]];
  data.panels.forEach(panel=>panel.responses.forEach(response=>rows.push([panel.id,panel.document_label,panel.unit,panel.proposed,response.window,response.contrast,response.first,response.revised,response.final,response.changed,data.revision_requested,panel.first_saved_at,panel.revised_saved_at,data.revision_choice_at,data.additional_information.provided,data.additional_information.seen_at,data.general_feedback?.text,data.general_feedback?.savedAt,...BACKGROUND_FIELDS.map(field=>data.background?.answers[field.id]),data.background?.savedAt])));
  return '\ufeff'+rows.map(row=>row.map(csvCell).join(",")).join("\r\n");
}

function csvCell(value) {
  let text=String(value??"");
  if(typeof value!=="number"&&/^[=+@\-\t\r]/.test(text))text="'"+text;
  return '"'+text.replace(/"/g,'""')+'"';
}
function mechanismCSV(data) {
  const m=data.mechanisms;
  const rows=[["comparison_id","comparison","reason_id","reason","importance_0_to_10","ratings_saved_at"]];
  if(m)m.comparisons.forEach(pair=>{
    m.items.forEach(item=>rows.push([pair.id,pair.label,item.id,item.label,m.ratings[pair.id][item.id],m.savedAt]));
    if(m.other)rows.push([pair.id,pair.label,"other",m.other,m.otherRatings[pair.id],m.savedAt]);
  });
  return '\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');
}
function renderSummary() {
  screen.innerHTML=`<div class="kicker">Demo complete</div><h1>Your predictions are ready to review</h1><p class="lead">Revision requested: <strong>${state.revisionRequested?"Yes":"No"}</strong>.</p><p>${state.revisionRequested?"The first and revised values are preserved separately. Changed predictions are highlighted below.":"Your first answers are the final answers. The revised-answer fields remain blank."}</p><div class="download-row"><button class="secondary" id="downloadCSV">Download answers (CSV)</button><button class="secondary" id="downloadJSON">Download full record (JSON)</button><button class="secondary" id="downloadMechanisms">Download reasons (CSV)</button></div><p class="small muted">Downloads stay under your control. This demo has not sent answers to the study team or Qualtrics.</p>${summaryHTML(true)}${mechanismSummaryHTML()}${feedbackSummaryHTML()}${backgroundSummaryHTML()}`;
  document.getElementById("downloadCSV").onclick=()=>download("sspp-demo-answers.csv",csvData(exportData()),"text/csv;charset=utf-8");
  document.getElementById("downloadJSON").onclick=()=>download("sspp-demo-answers.json",JSON.stringify(exportData(),null,2),"application/json");
  document.getElementById("downloadMechanisms").onclick=()=>download("sspp-demo-reasons.csv",mechanismCSV(exportData()),"text/csv;charset=utf-8");
  setNavigation("",null,"You can go back to review the introduction, tutorial, and locked answers.");
}
function openDialog(title,html) {document.getElementById("dialogTitle").textContent=title;document.getElementById("dialogBody").innerHTML=html;dialog.showModal();}
document.getElementById("faqButton").onclick=()=>openDialog("FAQ & reference",`<div class="faq-body"><h2>What do the treatment arms mean?</h2><p>Control received no study work. Stable received 9 bags every period. Predictable received 3 bags in three periods and 15 in three periods, with the full 6-period schedule known in advance. Risky received 3 or 15 bags with a 50-50 chance, revealed at the start of each period.</p><h2>What are participants doing?</h2><p>Stitching bags at home with flexible hours. Pilot experience suggests about 50–70 minutes per bag; the first five bags were picked up after 48 hours. The piece rate was GHC 12 per accepted bag, paid at pickup after quality checks. Stable and Predictable schedules were explained with comprehension questions. Risky assignments were revealed by scratchcards.</p><h2>What do 1–2, 1–4, and 1–6 mean?</h2><p>They include observations from the first two, first four, and all six two-week periods. Each longer window includes earlier periods. Predict an average difference using those observations; do not add coefficients or total spending across periods. The high-versus-low comparison uses all six periods.</p><h2>Which units should I enter?</h2><p>Mental health uses standard deviations from −0.50 to +0.50. Consumption uses differences in Ghana cedis (GHC) per household per two-week period, not logs, percentages, or standard deviations. Its starting graph range is provisional and expands to include typed amounts.</p><h2>What is the mental-health index?</h2><p>${escapeHTML(SETTINGS.mentalHealthDefinition)}</p><details><summary>Technical definition</summary><p>The index uses inverse-covariance weights. Symptom scales are reversed and the combined index is standardized to the Control group at baseline.</p></details>${implementationHTML()}<h2>Why ask about high- and low-work periods?</h2><p>The two plots ask whether consumption and mental health differ between periods with 15 versus 3 assigned bags, separately for Predictable and Risky. Consumption uses GHC; mental health uses SD. It is a within-arm comparison, not a treatment–Control effect. The precise estimation sample and consumption definition remain under review. Adding windows 1–2 and 1–4 is still for PI discussion. Both outcomes currently use periods 1–6.</p><h2>Can I go back?</h2><p>Yes. Back revisits earlier pages and preserves unfinished entries. Submitted predictions, ratings, additional comments, background answers and the revision decision are read-only. Return to current page resumes where you left off.</p><h2>What happens if I revise?</h2><p>After the additional-information step, you can revise the three numerical prediction pages. Your first answers stay locked. Mental-health ratings and optional general comments are collected once before additional information. The open question follows the reason ratings and invites any additional thoughts or suggestions. Both routes end with five optional questions about your background, prior familiarity with the study and confidence in your predictions. If the information page is still marked pending, the demo has provided no new study evidence.</p><h2>Are my answers sent anywhere?</h2><p>No. Answers are saved in this browser tab where supported. Download numerical answers and reasons as CSV, or the full record as JSON. This prototype is not yet connected to Qualtrics.</p></div>`);
document.getElementById("reviewButton").onclick=()=>openDialog("Your locked first answers",'<p class="small muted">Read-only. The optional revision round records new values separately.</p>'+summaryHTML(false)+mechanismSummaryHTML());
document.getElementById("closeDialog").onclick=()=>dialog.close();
document.getElementById("resetButton").onclick=()=>openDialog("Start a new demo?",'<p>This clears the answers stored for this demo in this browser tab. Download your completed answers first if you want to keep them.</p><button class="primary" id="confirmReset">Clear answers and restart</button>');
document.getElementById("dialogBody").addEventListener("click",event=>{if(event.target.id==="confirmReset"){state=newState();persist();dialog.close();render();}});
render();
</script>
</body>
