3px;text-align:center;color:var(--muted);margin-top:3px}.model-note{font-size:13px;color:var(--muted);margin-top:18px}.choice-list{display:grid;gap:14px;margin:25px 0}.choice{display:flex;gap:13px;align-items:flex-start;padding:17px;border:1px solid var(--line);border-radius:7px;cursor:pointer}.choice input{width:20px;height:20px;flex:none;margin-top:3px;accent-color:var(--red)}.choice strong{display:block}.choice span{font-size:14px;color:var(--muted)}.choices-foot{font-size:13px;color:var(--muted)}.download-row{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0}details{border-top:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:600}details>p{padding-top:12px}.summary-table{min-width:620px}.summary-table td:nth-child(2){text-align:left}.summary-table .changed{background:#fff5dc}.summary-card{margin:24px 0}.summary-card h2{margin:0 0 8px}.faq-body h2{font-size:17px;margin-top:24px}.faq-body p{font-size:15px}.window-explain{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.window-explain div{background:#f6f8fa;padding:18px;text-align:center;border-radius:7px}.window-explain strong{display:block;font-size:25px;color:var(--navy)}.window-explain span{font-size:13px;color:var(--muted)}.income-note{font-size:14px;color:#735318}.footer{font-size:12px;color:var(--muted);margin-top:22px}.footer button{font-size:12px;border:0;background:transparent;color:var(--navy);text-decoration:underline;padding:4px}.overview-list{padding-left:20px}.overview-list li{margin:8px 0}dialog{border:1px solid var(--line);border-radius:12px;padding:0;max-width:840px;width:calc(100% - 30px);max-height:87vh;color:var(--ink)}dialog::backdrop{background:rgba(19,35,49,.42)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding:16px 24px;position:sticky;top:0;background:white;z-index:1}.dialog-head h2{margin:0}.dialog-body{padding:8px 24px 24px}.readonly-value{font-weight:600}noscript{display:block;padding:24px;background:#fff2d3}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:650px){.shell{padding:18px 12px 30px}.topbar{align-items:flex-start}.brand{font-size:15px;max-width:180px}.quiet{padding:8px 10px;font-size:13px}.top-actions{gap:5px}.card{padding:22px 15px;border-radius:9px}h1{font-size:24px}.lead{font-size:16px}.arms{grid-template-columns:1fr}.next-row{align-items:stretch;flex-direction:column}.primary{width:100%}.window-explain{gap:7px}.window-explain div{padding:14px 5px}th,td{padding:7px 4px}.estimate{min-width:55px;padding:6px 2px}.legend{gap:6px 12px;justify-content:flex-start}.demo-strip{font-size:12px}.dialog-head{padding:14px 16px}.dialog-body{padding:8px 16px 20px}.unit-label{font-size:12px}.download-row button{flex:1}.progress-head{font-size:12px}.plot-help{font-size:12px}}

/* Keep the graph windows and table columns aligned, including on phones. */
.prediction-interface{--comparison-width:88px}
.plot-title{text-align:center;padding-left:var(--comparison-width);font-size:21px;margin:22px 0 0;letter-spacing:0}

.estimate-table th[scope=row]{white-space:normal;font-size:13px;padding-left:0}

.estimate-table thead tr:first-child th{border-bottom:0;padding-bottom:0}
.estimate-table thead tr:last-child th{padding-top:2px}

.practice-tasks .done{color:#28633e}
@media(max-width:650px){.prediction-question{font-size:16px}.plot-title{font-size:19px}.estimate-table th[scope=row]{font-size:11px}.row-comparison{gap:3px}.row-comparison svg{width:16px;height:16px}.estimate-table .estimate{min-width:0}.legend{font-size:12px;justify-content:center}.legend svg{width:18px;height:18px}.estimate-table th,.estimate-table td{padding-left:3px;padding-right:3px}}

<body>
<noscript>This interactive demo needs JavaScript enabled in your browser.</noscript>
<div class="shell">
  <header class="topbar"><div class="brand">Income stability &amp; health<span class="version">Prediction survey · 14 October 2026 revision</span></div><div class="top-actions"><button class="quiet" id="reviewButton" hidden>First answers</button><button class="quiet" id="faqButton">FAQ &amp; reference</button></div></header>
  <p class="demo-strip">Interactive demo · answers stay in this browser tab and can be downloaded. Nothing is submitted.</p>
  <div class="progress-head"><span id="phaseLabel"></span><span id="stepLabel"></span></div><div class="progress"><span id="progressFill"></span></div>
  <main id="screen" class="card" tabindex="-1"></main>
  <div id="navigation" class="next-row"></div>
  <footer class="footer">Study design prototype. Proposed content is labelled on the relevant pages. <button id="resetButton">Start a new demo</button><span id="storageNotice"></span></footer>
</div>
<dialog id="referenceDialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="quiet" id="closeDialog" aria-label="Close reference">Close</button></div><div id="dialogBody" class="dialog-body"></div></dialog>
<script>
"use strict";

// DEMO SETTINGS: turn enabled to false to remove an unwanted consumption page.
// This standalone demo does not submit data to Qualtrics or any other service.
const SETTINGS = {
  version: "2026-10-14-v2",
  min: -1, max: 1, tick: 0.5, step: 0.01,
  windows: ["1–2", "1–4", "1–6"],
  // Income values below illustrate the screen only; they are not study results.
  income: {
    ghcPerBag: 10,
    stable: [9,9,9,9,9,9],
    predictable: [15,15,3,3,15,3],
    risky: [3,3,15,3,15,15]
  }
};
const COLORS = {
  stable: {short:"S–C",label:"Stable − Control",fill:"#f0cc3e",stroke:"#897015",shape:"circle"},
  unstable: {short:"U–C",label:"Unstable − Control",fill:"#6186b3",stroke:"#36587b",shape:"diamond"},
  predictable: {short:"P–C",label:"Predictable − Control",fill:"#bc2d43",stroke:"#882034",shape:"square"},
  risky: {short:"R–C",label:"Risky − Control",fill:"#438761",stroke:"#255638",shape:"triangle"},
  matched: {short:"P–R",label:"Matched calendars: Predictable − Risky",fill:"#7756a4",stroke:"#523377",shape:"diamond"},
  early: {short:"Early: P–R",label:"Early-income calendars: P − R",fill:"#ce833b",stroke:"#90551f",shape:"circle"},
  late: {short:"Late: P–R",label:"Late-income calendars: P − R",fill:"#6578b4",stroke:"#3b4f88",shape:"square"}
};
const PANELS = [
  {id:"MH_slider_1",enabled:false,section:"Mental health",title:"Stable and unstable income",tag:"Prediction 1 · Mental health",unit:"Standard deviation changes relative to Control",unitCode:"sd",series:[COLORS.stable,COLORS.unstable],
   description:"Predict the difference in the individual mental-health index between Stable and Control, and between the pooled Predictable and Risky arms (called Unstable here) and Control.",
   explanation:"Enter one coefficient for each pooled reference window. A value of 0.20 means the mental-health index is 0.20 standard deviations higher than in Control. The direction of better mental health depends on the index's scoring; that direction is not specified in this draft."},
  {id:"MH_slider_2",enabled:true,section:"Mental health",title:"Mental health",tag:"Mental health",unit:"Standard deviation changes relative to Control",unitCode:"sd",series:[COLORS.stable,COLORS.predictable,COLORS.risky],
   description:"How much higher or lower will the mental-health index be in each treatment arm compared with Control?",
   explanation:"These are three separate treatment–control coefficients. They do not have to add up to anything. Positive values mean a higher mental-health index, and negative values mean a lower index."},
  {id:"MH_slider_3",enabled:true,section:"Mental health",title:"Compare matched work calendars",tag:"Prediction 3 · Mental health",unit:"Standard deviation difference: Predictable minus Risky",unitCode:"sd",series:[COLORS.matched],draft:true,
   description:"Suppose a participant in the Predictable arm and a participant in the Risky arm have the same realized six-period work calendar. Predict the mental-health difference between their arms over each reference window.",
   explanation:"Proposed comparison: match the full sequence of assigned work across Predictable and Risky, then predict P − R. A positive coefficient means a higher mental-health index in Predictable. The matching and estimation rules need study-team confirmation.",
   draftNote:"Working interpretation of MH_slider_3. The document requests matched calendars but does not define the exact coefficient. This draft uses Predictable − Risky within matched realized calendars."},
  {id:"MH_slider_4",enabled:true,section:"Mental health",title:"Income timing and anticipation",tag:"Prediction 4 · Mental health",unit:"Standard deviation difference: Predictable minus Risky",unitCode:"sd",series:[COLORS.early,COLORS.late],draft:true,
   description:"Keep the matched-calendar comparison, and separate calendars with most high-work periods early in the study from calendars with most high-work periods late. Predict P − R for each group.",
   explanation:"For this proposed definition, restrict to calendars with three high-work and three low-work periods. Early means at least two high-work periods occur in Periods 1–3; late means at least two occur in Periods 4–6. Match Predictable and Risky participants on the same full calendar within each group. These comparisons may inform anticipation hypotheses; they do not by themselves isolate optimism or dread.",
   draftNote:"Working interpretation of MH_slider_4, for discussion. Early- versus late-income calendars are an editable way to explore anticipation. The document does not yet specify the optimism/dread measure."},
  {id:"CON_slider_1_log",documentLabel:"CON_slider_1",enabled:true,section:"Consumption",title:"Household consumption",tag:"Consumption · Version A of 3",unit:"Log-point changes relative to Control",unitCode:"log_points",series:[COLORS.stable,COLORS.predictable,COLORS.risky],alternative:true,
   description:"Predict the difference in log total household consumption between each treatment arm and Control over each reference window.",
   explanation:"Enter log points: 0.10 log points corresponds to approximately 10.5% higher consumption. −0.10 corresponds to approximately 9.5% lower consumption. Zero means no difference. This is a linear axis measured in log points, not a logarithmic axis."},
  {id:"CON_slider_1_sd",documentLabel:"CON_slider_1",enabled:true,section:"Consumption",title:"Household consumption",tag:"Consumption · Version B of 3",unit:"Standard deviation changes relative to Control",unitCode:"sd",series:[COLORS.stable,COLORS.predictable,COLORS.risky],alternative:true,
   description:"Predict the difference in standardized total household consumption between each treatment arm and Control over each reference window.",
   explanation:"Enter standard deviation units: 0.20 means consumption is 0.20 standard deviations higher than in Control. −0.20 means it is 0.20 standard deviations lower. The reference sample and standardization of consumption need to be specified before fielding this version."},
  {id:"CON_slider_1_proportion",documentLabel:"CON_slider_1",enabled:true,section:"Consumption",title:"Household consumption",tag:"Consumption · Version C of 3",unit:"Proportional changes relative to Control",unitCode:"proportion",series:[COLORS.stable,COLORS.predictable,COLORS.risky],alternative:true,
   description:"Predict the proportional difference in total household consumption between each treatment arm and Control over each reference window.",
   explanation:"Enter a proportion, not a whole-number percentage: 0.10 means 10% higher consumption, −0.10 means 10% lower, and 0 means no difference. The scale −1 to +1 corresponds to −100% to +100%."}
];

const enabledPanels = PANELS.filter(panel=>panel.enabled);
const infoScreens = ["welcome","design","compliance","income","instructions","tutorial"];
const PRACTICE_PANEL = {
  id:"tutorial",title:"Practice score",unit:"Practice difference (fictional units)",
  series:[{...COLORS.stable,short:"Example A",label:"Example A"},{...COLORS.predictable,short:"Example B",label:"Example B"},{...COLORS.risky,short:"Example C",label:"Example C"}]
};
const screen = document.getElementById("screen");
const navigation = document.getElementById("navigation");
const dialog = document.getElementById("referenceDialog");
const STORAGE_KEY = "sspp-slider-demo-" + SETTINGS.version + "-" + enabledPanels.map(panel=>panel.id).join("-");
let resizeObserver = null;

function newState() {
  return {version:SETTINGS.version,startedAt:new Date().toISOString(),phase:"first",index:0,first:{},drafts:{},revised:{},revisionDrafts:{},practice:{values:Array(9).fill(""),tasks:[false,false,false],completedAt:null},revisionRequested:null,revisionChoiceAt:null,finishedAt:null};
}
function loadState() {
  try {
    const saved=JSON.parse(sessionStorage.getItem(STORAGE_KEY));
    if (saved && saved.version===SETTINGS.version) return saved;
  } catch (_) { /* The demo also works when browser storage is unavailable. */ }
  return newState();
}
let state=loadState();
function persist() {
  try { sessionStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
  catch (_) { document.getElementById("storageNotice").textContent=" Browser storage is unavailable; keep this page open or download your answers."; }
}
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
}
function format(value) { return (Math.abs(value)<0.000001?0:value).toFixed(2); }
function parseAnswer(raw) {
  const text=String(raw).trim();
  if (!text) return {value:null,error:"",valid:false};
  if (!/^[+-]?(?:\d+(?:[.,]\d*)?|[.,]\d+)$/.test(text)) return {value:null,error:"Enter a number.",valid:false};
  const value=Number(text.replace(",","."));
  if (!Number.isFinite(value)||value<SETTINGS.min||value>SETTINGS.max) return {value:null,error:"Enter a value between −1.00 and +1.00.",valid:false};
  if (Math.abs(value*100-Math.round(value*100))>0.000001) return {value:null,error:"Use up to two decimal places.",valid:false};
  return {value:value===0?0:value,error:"",valid:true};
}
function rawFor(panel) {
  const target=state.phase==="revision"?state.revisionDrafts:state.drafts;
  if (!target[panel.id]) target[panel.id]=state.phase==="revision"?state.first[panel.id].values.map(format):Array(SETTINGS.windows.length*panel.series.length).fill("");
  return target[panel.id];
}
function modelNote() { return '<p class="model-note">Model includes community, cohort, and period fixed effects.</p>'; }
function currentSteps() { return state.phase==="revision"?enabledPanels.map(p=>p.id):infoScreens.concat(enabledPanels.map(p=>p.id),["revision-choice"]); }
function setNavigation(label,handler,note,disabled=false) {
  navigation.innerHTML='<p>'+escapeHTML(note||"")+'</p><button class="primary" id="nextButton">'+escapeHTML(label)+'</button>';
  const next=document.getElementById("nextButton"); next.disabled=disabled; next.addEventListener("click",handler);
}
function advanceInfo() { state.index++;persist();render(); }
function render() {
  if(resizeObserver) resizeObserver.disconnect();
  screen.replaceChildren();navigation.replaceChildren();
  document.getElementById("reviewButton").hidden=Object.keys(state.first).length===0;
  if(state.phase==="finished") {
    document.getElementById("phaseLabel").textContent="Demo complete";
    document.getElementById("stepLabel").textContent="First and revised answers preserved";
    document.getElementById("progressFill").style.width="100%";
    renderSummary();screen.focus({preventScroll:true});window.scrollTo(0,0);return;
  }
  const steps=currentSteps(), id=steps[state.index];
  document.getElementById("phaseLabel").textContent=state.phase==="revision"?"Revision round":"First round";
  document.getElementById("stepLabel").textContent="Page "+(state.index+1)+" of "+steps.length;
  document.getElementById("progressFill").style.width=((state.index+1)/steps.length*100)+"%";
  const panel=enabledPanels.find(p=>p.id===id);
  if(panel) renderPanel(panel);
  else if(id==="tutorial") renderTutorial();
  else if(id==="revision-choice") renderRevisionChoice();
  else renderInfo(id);
  screen.focus({preventScroll:true});window.scrollTo(0,0);
}

function renderInfo(id) {
  if(id==="welcome") {
    screen.innerHTML=`<div class="kicker">About the study</div><h1>Investigating the effects of income volatility and uncertainty</h1><div class="prose"><p class="lead">How do stable, predictable, and risky income affect mental health and household consumption?</p><p>This survey gathers predictions for a study of female participants from households in rural northern Ghana (n = 2,272). Participants are randomly assigned to treatment and control arms, and data are collected through in-person and phone surveys.</p><p>The study provides temporary work stitching bags over six two-week periods. You will predict treatment effects, then have an opportunity to revise your predictions while keeping a record of your first answers.</p><details><summary>Study information and draft consent text</summary><p><strong>Grant:</strong> 1R01AG076655-01<br><strong>Authors:</strong> Heather Schofield, Vincent Somville, Leandro Carvalho, Damien de Walque, Jingyao Wei, and Nicholas Grandstaff<br><strong>Corresponding author:</strong> Heather Schofield; hws44@cornell.edu</p><p>The supplied study introduction states that the study has IRB approval from Ghana Health Services, the National Institute of Health, the Norwegian School of Economics, Cornell University, the University of Pennsylvania, the University of Southern California, and the World Bank. It describes minimal risks, compensation for participants' time, informed consent before enrollment, and de-identified personal information stored securely.</p><p>The draft survey takes about ten minutes. Predictions will be analyzed as part of an academic project. The draft describes anonymous responses and the option to withdraw by exiting before the end of the survey.</p><p><strong>In this demonstration, continuing only starts the demo; no research consent or response is submitted.</strong></p></details></div><p class="meta">Mental health first · Consumption second · Optional revision</p><button class="secondary" id="quickPreview">Preview the tutorial &amp; sliders</button>`;
    document.getElementById("quickPreview").onclick=()=>{state.index=infoScreens.indexOf("tutorial");state.introductionSkipped=true;persist();render();};
    setNavigation("Start demo →",advanceInfo,"The red button starts the introductory screens.");
  }
  if(id==="design") {
    screen.innerHTML=`<div class="kicker">Study design</div><h1>Six periods, four study arms</h1><p class="lead">Work is piece-rate at a consistent payment per bag. Each period lasts two weeks.</p><p>In expectation, treated arms have the same work and earnings over the 12-week study. What differs is how work varies across time and what participants know in advance.</p><div class="arms"><div class="arm"><h2>Control</h2><p>No study work; participants are followed over the course of the study.</p></div><div class="arm s"><h2>Stable income</h2><p>Work hours and pay are fixed. The earlier study description assigns nine bags every period.</p></div><div class="arm p"><h2>Predictable income</h2><p>Work varies, but the full schedule is known in advance. The earlier description uses three or fifteen bags, with three high and three low periods.</p></div><div class="arm r"><h2>Risky income</h2><p>Work varies unpredictably. The earlier description uses a 50–50 high/low draw at the start of each period.</p></div></div><p class="small muted">The Risky arm's realized total can vary even though its expected total is the same.</p>`;
    setNavigation("Continue →",advanceInfo,"The FAQ remains available throughout the demo.");
  }
  if(id==="compliance") {
    screen.innerHTML=`<div class="kicker">Study implementation</div><h1>Compliance with assigned work</h1><div class="prose"><p class="lead">This information screen will summarize how closely participants followed their assigned work schedules.</p><div class="draft-note"><strong>Study figures to be added.</strong> The document requests a compliance briefing but provides no compliance rates or implementation results. This demo does not assume perfect compliance.</div><p>The final screen should report the assigned and completed work, payment delivery, and any meaningful differences across arms. It will help respondents distinguish the intended study design from what was implemented.</p><p>No prediction is requested on this screen.</p></div>`;
    setNavigation("Continue →",advanceInfo,"Information only; no answer is recorded here.");
  }
  if(id==="income") {
    screen.innerHTML=`<div class="kicker">Income reference</div><h1>Assigned study income</h1><p>The vertical axis shows Ghana cedis (GHC). Each point totals assigned study income across the reference window.</p><div class="draft-note"><strong>Illustrative example, not study data.</strong> This uses GHC ${SETTINGS.income.ghcPerBag} per bag and example calendars to demonstrate the requested screen. Replace these inputs with the study's assigned-income figures.</div><p class="unit-label">Assigned study income (GHC)</p><div id="incomePlot" class="plot"></div><p class="axis-note">Assigned study income by reference window</p><div id="incomeLegend" class="legend"></div><div class="grid-wrap" id="incomeTable"></div><p class="income-note">The Risky example happens to have three high and three low periods; equal realized totals are not guaranteed by the Risky design.</p>`;
    const series=[{...COLORS.stable,short:"Stable",label:"Stable"},{...COLORS.predictable,short:"Predictable",label:"Predictable"},{...COLORS.risky,short:"Risky",label:"Risky"}];
    const incomes=[SETTINGS.income.stable,SETTINGS.income.predictable,SETTINGS.income.risky];
    const values=[2,4,6].flatMap(end=>incomes.map(calendar=>calendar.slice(0,end).reduce((a,b)=>a+b,0)*SETTINGS.income.ghcPerBag));
    const max=Math.ceil(Math.max(...values)/100)*100;
    const panel={id:"assigned_income",series,min:0,max,tick:max/4};
    drawPlot(document.getElementById("incomePlot"),panel,values,false,()=>{});
    drawLegend(document.getElementById("incomeLegend"),series);
    document.getElementById("incomeTable").innerHTML=tableHTML(series,values,false,"income");
    setNavigation("Continue →",advanceInfo,"This reference screen does not ask for predictions.");
  }
  if(id==="instructions") {
    screen.innerHTML=`<div class="kicker">How predictions work</div><h1>Predict effects over three reference windows</h1><p class="lead">Each marker represents one estimated coefficient using observations pooled across the indicated periods.</p><div class="window-explain"><div><strong>1–2</strong><span>Periods 1 and 2</span></div><div><strong>1–4</strong><span>Periods 1 through 4</span></div><div><strong>1–6</strong><span>All six periods</span></div></div><div class="prose"><p>Drag the markers vertically, or enter numbers in the table. All markers start at zero but remain hollow until you explicitly answer. The scale runs from −1 to +1.</p><p><strong>First answers lock when you continue.</strong> You can inspect them through “First answers,” but you cannot edit them until the optional revision round. Your first and second answers are stored separately in this demo.</p><p>Mental health is measured for the individual. Consumption is measured for the household. This demo includes three alternative consumption pages so the team can choose between log points, standard deviations, and proportional changes.</p><p>Actual study results and mechanism-feedback materials have not been supplied, so this demo ends with a review of your predictions.</p></div>`;
    setNavigation("Try the practice exercise →",advanceInfo,"Practice with fictional examples before making your first prediction.");
  }
}

function svgElement(tag,attrs,parent,text) {
  const node=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const [key,value] of Object.entries(attrs||{})) node.setAttribute(key,value);
  if(text!==undefined) node.textContent=text;
  parent.appendChild(node);return node;
}
function drawShape(parent,series,x,y,fill) {
  const attrs={fill,stroke:series.stroke,"stroke-width":2};
  if(series.shape==="circle") return svgElement("circle",{...attrs,cx:x,cy:y,r:7},parent);
  if(series.shape==="square") return svgElement("rect",{...attrs,x:x-7,y:y-7,width:14,height:14},parent);
  if(series.shape==="triangle") return svgElement("polygon",{...attrs,points:`${x},${y-9} ${x-9},${y+7} ${x+9},${y+7}`},parent);
  return svgElement("polygon",{...attrs,points:`${x},${y-9} ${x-8},${y} ${x},${y+9} ${x+8},${y}`},parent);
}
function drawLegend(target,series) {
  target.replaceChildren();
  series.forEach(item=>{const span=document.createElement("span");const icon=svgElement("svg",{viewBox:"0 0 24 24","aria-hidden":"true"},span);drawShape(icon,item,12,12,item.fill);span.append(document.createTextNode(item.label));target.append(span);});
}
function drawPlot(target,panel,raw,interactive,onChange) {
  target.replaceChildren();
  const width=Math.max(240,target.clientWidth),height=340,left=Math.min(210,Math.max(88,width*.24)),right=width,top=23,bottom=285;
  target.parentElement.style.setProperty("--comparison-width",left+"px");
  const min=panel.min??SETTINGS.min,max=panel.max??SETTINGS.max,tick=panel.tick??SETTINGS.tick;
  const y=value=>bottom-(value-min)/(max-min)*(bottom-top);
  const svg=svgElement("svg",{viewBox:`0 0 ${width} ${height}`,role:"group","aria-label":panel.title||"Assigned study income"},target);
  if(panel.unit) svgElement("text",{transform:`translate(${left-68} ${(top+bottom)/2}) rotate(-90)`,"text-anchor":"middle","font-size":11,fill:"#596b79"},svg,panel.unit);
  for(let i=0;min+i*tick<=max+0.000001;i++) {
    const value=min+i*tick;
    svgElement("line",{x1:left,x2:right,y1:y(value),y2:y(value),stroke:Math.abs(value)<0.000001?"#788895":"#e4e8ec","stroke-width":Math.abs(value)<0.000001?1.5:1},svg);
    svgElement("text",{x:left-9,y:y(value)+4,"text-anchor":"end","font-size":12,fill:"#596b79"},svg,max>2?String(Math.round(value)):format(value));
  }
  const groupWidth=(right-left)/SETTINGS.windows.length;
  SETTINGS.windows.forEach((window,r)=>{
    const x=left+(r+.5)*groupWidth;
    svgElement("text",{x,y:bottom+25,"text-anchor":"middle","font-size":14,fill:"#344e62"},svg,window);
  });
  svgElement("text",{x:(left+right)/2,y:height-4,"text-anchor":"middle","font-size":13,fill:"#344e62"},svg,"Periods");
  const nodes=[];
  raw.forEach((value,i)=>{
    const r=Math.floor(i/panel.series.length),s=i%panel.series.length,series=panel.series[s];
    const spacing=Math.min(width<500?22:32,(groupWidth-8)/panel.series.length);
    const x=left+(r+.5)*groupWidth+(s-(panel.series.length-1)/2)*spacing;
    const label=`Periods ${SETTINGS.windows[r]}, ${series.label}`;
    const group=svgElement("g",interactive?{class:"handle",tabindex:0,role:"slider","aria-label":label,"aria-orientation":"vertical","aria-valuemin":min,"aria-valuemax":max}:{role:"img","aria-label":label},svg);
    const title=svgElement("title",{},group,label);
    if(interactive) svgElement("rect",{x:-spacing/2,y:-21,width:spacing,height:42,rx:4,fill:"transparent",class:"hit"},group);
    const symbol=drawShape(group,series,0,0,series.fill);
    nodes.push({group,symbol,title,x,label,series});
    if(!interactive) return;
    let drag=null;
    function pointValue(event) { const point=svg.createSVGPoint();point.x=event.clientX;point.y=event.clientY;const local=point.matrixTransform(svg.getScreenCTM().inverse());return min+(bottom-local.y)/(bottom-top)*(max-min); }
    function setValue(value) { onChange(i,value===null?"":format(Math.max(min,Math.min(max,Math.round(value*100)/100))),"marker"); }
    group.addEventListener("pointerdown",event=>{if(event.button!==0)return;event.preventDefault();group.focus();group.setPointerCapture(event.pointerId);const answer=parseAnswer(raw[i]);drag={id:event.pointerId,start:pointValue(event),value:answer.valid?answer.value:0};setValue(drag.value);});
    group.addEventListener("pointermove",event=>{if(drag&&drag.id===event.pointerId)setValue(drag.value+pointValue(event)-drag.start);});
    ["pointerup","pointercancel","lostpointercapture"].forEach(type=>group.addEventListener(type,event=>{if(drag&&drag.id===event.pointerId)drag=null;}));
    group.addEventListener("keydown",event=>{
      const parsed=parseAnswer(raw[i]);let value=parsed.valid?parsed.value:0;const step=event.shiftKey ? 0.1 : 0.01;
      if(event.key==="ArrowUp"||event.key==="ArrowRight")value+=step;
      else if(event.key==="ArrowDown"||event.key==="ArrowLeft")value-=step;
      else if(event.key==="Home")value=min;
      else if(event.key==="End")value=max;
      else if(event.key==="Delete"||event.key==="Backspace")value=null;
      else if(event.key!=="Enter"&&event.key!==" ")return;
      event.preventDefault();setValue(value);
    });
  });
  function refresh() {
    nodes.forEach((node,i)=>{
      const parsed=interactive?parseAnswer(raw[i]):{valid:raw[i]!==null,value:raw[i]};
      const value=parsed.valid?parsed.value:0;
      node.group.setAttribute("transform",`translate(${node.x},${y(value)})`);
      node.symbol.setAttribute("fill",parsed.valid?node.series.fill:"white");
      node.symbol.setAttribute("stroke-dasharray",parsed.valid?"none":"3 2");
      node.group.setAttribute("aria-valuenow",value);
      node.group.setAttribute("aria-valuetext",parsed.valid?(max>2?String(value):format(value)):"Not answered; starting position zero");
      node.title.textContent=node.label+": "+(parsed.valid?(max>2?String(value):format(value)):"not answered");
    });
  }
  refresh();return refresh;
}
function tableHTML(series,values,editable,prefix) {
  let html='<table class="estimate-table"><colgroup><col class="comparison-column"><col><col><col></colgroup><thead><tr><th scope="col" rowspan="2"><span class="sr-only">Comparison</span></th><th scope="colgroup" colspan="3">Periods</th></tr><tr>'+SETTINGS.windows.map(window=>'<th scope="col">'+window+'</th>').join("")+'</tr></thead><tbody>';
  series.forEach((s,c)=>{
    html+='<tr><th scope="row"><span class="row-comparison">'+shapeHTML(s)+'<span>'+escapeHTML(s.label)+'</span></span></th>';
    SETTINGS.windows.forEach((window,r)=>{
      const i=r*series.length+c;
      html+='<td>'+(editable?'<input class="estimate" type="text" inputmode="decimal" autocomplete="off" id="'+prefix+'_'+i+'" data-cell="'+i+'" value="'+escapeHTML(values[i])+'" aria-label="Periods '+window+', '+escapeHTML(s.label)+'" aria-describedby="entryHelp">':(values[i]===null?'—':escapeHTML(prefix==="income"?values[i]:format(values[i]))))+'</td>';
    });html+='</tr>';
  });return html+'</tbody></table>';
}
function shapeHTML(series) {
  const wrapper=document.createElement("span");
  const svg=svgElement("svg",{viewBox:"0 0 24 24","aria-hidden":"true"},wrapper);
  drawShape(svg,series,12,12,series.fill);return wrapper.innerHTML;
}
function entryHelpHTML() {
  return '<p id="entryHelp" class="plot-help">Drag a marker or enter a number from −1 to +1 in the box. Hollow markers are unanswered. If a marker is already at zero, click the marker to confirm zero.<br><span class="keyboard-help">Keyboard: arrows adjust, Enter confirms, Delete clears.</span></p>';
}
function answerInterfaceHTML(panel,raw) {
  return `<div class="prediction-interface"><h1 class="plot-title">${escapeHTML(panel.title)}</h1><div id="predictionPlot" class="plot"></div><div id="predictionLegend" class="legend"></div><div class="grid-wrap">${tableHTML(panel.series,raw,true,panel.id)}</div></div><p id="answerStatus" class="answer-status" role="status" aria-live="polite"></p>`;
}
function mountAnswerInterface(panel,raw,onUpdate) {
  // DOM rows are comparisons; response arrays remain indexed by window then comparison.
  const inputs=Array.from(screen.querySelectorAll(".estimate")).sort((a,b)=>Number(a.dataset.cell)-Number(b.dataset.cell));
  let refreshPlot;
  function update(index,value,source) {
    if(index!==undefined){raw[index]=value;inputs[index].value=value;}
    let answered=0,firstError="";
    inputs.forEach((input,i)=>{const parsed=parseAnswer(raw[i]);if(parsed.valid)answered++;if(parsed.error&&!firstError)firstError=`Periods ${SETTINGS.windows[Math.floor(i/panel.series.length)]}, ${panel.series[i%panel.series.length].short}: ${parsed.error}`;input.setAttribute("aria-invalid",parsed.error?"true":"false");input.setCustomValidity(parsed.error);});
    const status=document.getElementById("answerStatus");
    status.className="answer-status"+(firstError?" error":"");
    status.textContent=firstError;
    if(refreshPlot)refreshPlot();
    onUpdate({index,value,source,complete:answered===raw.length&&!firstError});persist();
  }
  inputs.forEach((input,i)=>{input.addEventListener("input",()=>update(i,input.value,"box"));input.addEventListener("blur",()=>{const parsed=parseAnswer(input.value);if(parsed.valid)update(i,format(parsed.value),"format");});});
  const target=document.getElementById("predictionPlot");
  function redraw(){refreshPlot=drawPlot(target,panel,raw,true,update);}
  redraw();drawLegend(document.getElementById("predictionLegend"),panel.series);update();
  resizeObserver=new ResizeObserver(redraw);resizeObserver.observe(target);
}
function predictionTag(panel) {
  return `Prediction ${enabledPanels.indexOf(panel)+1} of ${enabledPanels.length}${panel.alternative?" · "+panel.tag:""}`;
}
function renderPanel(panel) {
  const revising=state.phase==="revision",raw=rawFor(panel);
  screen.innerHTML=`<div class="kicker">${escapeHTML(predictionTag(panel))}${revising?" · Revision":""}</div>${panel.draft?'<span class="draft-tag">Proposed comparison · for discussion</span>':""}<p class="prediction-question"><strong>${escapeHTML(panel.description)}</strong></p>${panel.draft?'<div class="draft-note">'+escapeHTML(panel.draftNote)+'</div>':""}${entryHelpHTML()}${answerInterfaceHTML(panel,raw)}<details><summary>How to interpret this prediction</summary><p>${escapeHTML(panel.explanation)}</p>${modelNote()}${panel.alternative?'<p class="small muted">Alternative unit version. Keep this page or either of the other consumption versions when finalizing the survey.</p>':""}</details>${revising?'<p class="small muted">Your first answers are preserved. Change only the predictions you wish to revise; all other values carry forward.</p>':""}`;
  setNavigation(revising?"Save revision & continue →":"Lock answers & continue →",()=>commitPanel(panel),revising?"This saves a separate second answer for this page.":"Enter every estimate, including zeros, before continuing. Continuing locks this page until the optional revision round.",true);
  mountAnswerInterface(panel,raw,({complete})=>{document.getElementById("nextButton").disabled=!complete;});
}
function renderTutorial() {
  const practice=state.practice;
  screen.innerHTML=`<div class="kicker">Practice · not a survey prediction</div><p class="prediction-question"><strong>Try the graph and the answer boxes before making your predictions.</strong></p><p class="small muted">These fictional examples teach the controls. The practice numbers are not suggested treatment effects and are not included in your answers.</p><ol id="practiceTasks" class="practice-tasks" aria-live="polite"></ol>${entryHelpHTML()}${answerInterfaceHTML(PRACTICE_PANEL,practice.values)}<p class="small muted">The graph and table update together. Complete the three steps above; you can leave the other boxes blank.</p>`;
  setNavigation("Start my predictions →",()=>{
    if(!practice.tasks.every(Boolean))return;
    state.practice={values:Array(9).fill(""),tasks:[false,false,false],completedAt:new Date().toISOString()};
    advanceInfo();
  },"Practice entries are discarded. Your real prediction page starts blank.",true);
  const tasks=["Move the Example A marker for Periods 1–2 away from zero. Drag it, or select it and use an arrow key.","Enter 0.25 in the Example B box for Periods 1–4.","Confirm zero for Example C in Periods 1–6: click its hollow marker at zero, or select it and press Enter. If you moved it, first return it to zero."];
  mountAnswerInterface(PRACTICE_PANEL,practice.values,({index,value,source})=>{
    const parsed=parseAnswer(value??"");
    if(parsed.valid){
      if(index===0&&source==="marker"&&parsed.value!==0)practice.tasks[0]=true;
      if(index===4&&source==="box"&&parsed.value===0.25)practice.tasks[1]=true;
      if(index===8&&source==="marker"&&parsed.value===0)practice.tasks[2]=true;
    }
    document.getElementById("practiceTasks").innerHTML=tasks.map((task,i)=>`<li class="${practice.tasks[i]?"done":""}">${practice.tasks[i]?'<strong>Done.</strong> ':""}${task}</li>`).join("");
    document.getElementById("nextButton").disabled=!practice.tasks.every(Boolean);
  });
}
function commitPanel(panel) {
  const raw=rawFor(panel),parsed=raw.map(parseAnswer);
  if(parsed.some(value=>!value.valid))return;
  const record={values:parsed.map(value=>value.value),savedAt:new Date().toISOString()};
  if(state.phase==="revision")state.revised[panel.id]=record;
  else if(!state.first[panel.id])state.first[panel.id]=record;
  state.index++;
  if(state.phase==="revision"&&state.index>=enabledPanels.length){state.phase="finished";state.finishedAt=new Date().toISOString();}
  persist();render();
}

function renderRevisionChoice() {
  screen.innerHTML=`<div class="kicker">Review your predictions</div><h1>Would you like to revise your first answers?</h1><p class="lead">Your first answers are now locked and saved separately.</p><p>You can inspect them using “First answers” above. If you revise, each prediction page will reopen with its existing values, so you only need to change the estimates you want to change.</p><div class="choice-list"><label class="choice"><input type="radio" name="revise" value="yes"><div><strong>Yes, I would like to revise</strong><span>Keep my first answers and record a second set separately.</span></div></label><label class="choice"><input type="radio" name="revise" value="no"><div><strong>No, keep my first answers</strong><span>Finish with my first answers. No second set will be invented.</span></div></label></div><p class="choices-foot">Your yes/no choice is recorded. This demo does not show actual study results before the decision.</p>`;
  setNavigation("Continue →",()=>{
    const selected=screen.querySelector('input[name="revise"]:checked');if(!selected)return;
    state.revisionRequested=selected.value==="yes";state.revisionChoiceAt=new Date().toISOString();
    state.phase=state.revisionRequested?"revision":"finished";state.index=0;
    if(!state.revisionRequested)state.finishedAt=new Date().toISOString();persist();render();
  },"The revision decision is stored with your first and second answers.",true);
  screen.querySelectorAll('input[name="revise"]').forEach(input=>input.addEventListener("change",()=>{document.getElementById("nextButton").disabled=false;}));
}
function summaryHTML(includeRevised) {
  let html="";
  enabledPanels.forEach(panel=>{
    if(!state.first[panel.id])return;
    const first=state.first[panel.id].values,revised=state.revised[panel.id]?.values;
    html+=`<section class="summary-card"><h2>${escapeHTML(predictionTag(panel))} — ${escapeHTML(panel.title)}</h2><p class="small muted">${escapeHTML(panel.unit)}${panel.draft?" · Proposed contrast":""}</p><div class="grid-wrap"><table class="summary-table"><thead><tr><th>Periods</th><th>Comparison</th><th>First</th>${includeRevised?"<th>Revised</th><th>Final</th>":""}</tr></thead><tbody>`;
    first.forEach((value,i)=>{
      const changed=revised&&revised[i]!==value;
      html+=`<tr${changed?' class="changed"':""}><td>${SETTINGS.windows[Math.floor(i/panel.series.length)]}</td><td>${escapeHTML(panel.series[i%panel.series.length].label)}</td><td>${format(value)}</td>${includeRevised?'<td>'+(revised?format(revised[i]):"—")+'</td><td>'+format(revised?revised[i]:value)+'</td>':""}</tr>`;
    });html+='</tbody></table></div></section>';
  });return html;
}
function exportData() {
  return {
    demo:true,specification:"Revising Sliders 10.12.26.docx",feedback:"Feedback Interface - Oct 14, 2026 LSC vs3.pdf",version:SETTINGS.version,
    tutorial_completed_at:state.practice.completedAt,
    started_at:state.startedAt,finished_at:state.finishedAt,
    revision_requested:state.revisionRequested,revision_choice_at:state.revisionChoiceAt,
    windows:SETTINGS.windows,axis:{min:SETTINGS.min,max:SETTINGS.max,step:SETTINGS.step},
    panels:enabledPanels.map(panel=>({id:panel.id,document_label:panel.documentLabel||panel.id,title:panel.title,unit:panel.unitCode,unit_label:panel.unit,proposed:!!panel.draft,alternative_version:!!panel.alternative,contrasts:panel.series.map(s=>s.label),definition:panel.explanation,first_saved_at:state.first[panel.id]?.savedAt||null,revised_saved_at:state.revised[panel.id]?.savedAt||null,
      responses:SETTINGS.windows.flatMap((window,r)=>panel.series.map((series,s)=>{
        const i=r*panel.series.length+s,first=state.first[panel.id]?.values[i]??null,second=state.revised[panel.id]?.values[i]??null;
        return {window,contrast:series.label,first,revised:second,final:second===null?first:second,changed:second===null?false:second!==first};
      }))
    }))
  };
}
function download(name,content,type) {
  const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvData(data) {
  const rows=[["panel_id","document_label","unit","proposed_contrast","reference_window","comparison","first_answer","revised_answer","final_answer","changed","revision_requested","first_saved_at","revised_saved_at","revision_choice_at"]];
  data.panels.forEach(panel=>panel.responses.forEach(response=>rows.push([panel.id,panel.document_label,panel.unit,panel.proposed,response.window,response.contrast,response.first,response.revised,response.final,response.changed,data.revision_requested,panel.first_saved_at,panel.revised_saved_at,data.revision_choice_at])));
  return '\ufeff'+rows.map(row=>row.map(value=>'"'+String(value??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
}
function renderSummary() {
  screen.innerHTML=`<div class="kicker">Demo complete</div><h1>Your predictions are ready to review</h1><p class="lead">Revision requested: <strong>${state.revisionRequested?"Yes":"No"}</strong>.</p><p>${state.revisionRequested?"The first and revised values are preserved separately. Changed predictions are highlighted below.":"Your first answers are the final answers. The revised-answer fields remain blank."}</p><div class="download-row"><button class="secondary" id="downloadCSV">Download answers (CSV)</button><button class="secondary" id="downloadJSON">Download full record (JSON)</button></div><p class="small muted">Downloads stay under your control. This demo has not sent answers to the study team or Qualtrics.</p>${summaryHTML(true)}`;
  document.getElementById("downloadCSV").onclick=()=>download("sspp-demo-answers.csv",csvData(exportData()),"text/csv;charset=utf-8");
  document.getElementById("downloadJSON").onclick=()=>download("sspp-demo-answers.json",JSON.stringify(exportData(),null,2),"application/json");
  navigation.innerHTML='<p>The study-results and mechanism-feedback screens can be added when their content is available.</p>';
}
function openDialog(title,html) {document.getElementById("dialogTitle").textContent=title;document.getElementById("dialogBody").innerHTML=html;dialog.showModal();}
document.getElementById("faqButton").onclick=()=>openDialog("FAQ & reference",`<div class="faq-body"><h2>What do the treatment arms mean?</h2><p>Control receives no study work. Stable receives fixed work. Predictable receives varying work with the schedule known in advance. Risky receives varying work revealed at the start of each period. Unstable pools Predictable and Risky.</p><h2>What do 1–2, 1–4, and 1–6 mean?</h2><p>They are pooled reference windows: the first two, first four, and all six two-week periods. They are not six individual-period predictions or the sum of the coefficients.</p><h2>Which units should I enter?</h2><p>Mental health uses standard deviations. Consumption is shown in three alternative versions: log points, standard deviations, and proportional changes. The version appears above each graph. A 0.10 proportional change is 10%; 0.10 log points is approximately 10.5%.</p><h2>Does a positive mental-health value mean better health?</h2><p>It means a higher index value. The scoring direction is not defined in the supplied revision and must be added before fielding.</p><h2>What happens to my first answers?</h2><p>They lock when you continue. “First answers” is read-only. Choosing to revise starts a separate round with copies of your first answers. Choosing not to revise leaves the second-answer fields empty.</p><h2>How do matched-calendar drafts work?</h2><p>MH_slider_3 proposes Predictable − Risky for the same realized full calendar. MH_slider_4 proposes that contrast separately for early- and late-income calendars with three high-work periods. Early means at least two high periods in Periods 1–3; late means at least two in Periods 4–6. These proposed definitions can be revised and are not established tests of optimism or dread.</p><h2>Is the income chart actual study data?</h2><p>No. Its GHC ${SETTINGS.income.ghcPerBag} per bag and calendars are illustrative. Study income and compliance figures have not been supplied for this revision.</p><h2>What is included in the model?</h2><p>Community, cohort, and period fixed effects, as requested in the document. Exact matching rules and index standardization remain to be specified.</p><h2>Are my answers sent anywhere?</h2><p>No. They are saved in this browser tab where supported. Download CSV or JSON at the end to keep a copy. This prototype is not yet connected to Qualtrics.</p></div>`);
document.getElementById("reviewButton").onclick=()=>openDialog("Your locked first answers",'<p class="small muted">Read-only. The optional revision round records new values separately.</p>'+summaryHTML(false));
document.getElementById("closeDialog").onclick=()=>dialog.close();
document.getElementById("resetButton").onclick=()=>openDialog("Start a new demo?",'<p>This clears the answers stored for this demo in this browser tab. Download your completed answers first if you want to keep them.</p><button class="primary" id="confirmReset">Clear answers and restart</button>');
document.getElementById("dialogBody").addEventListener("click",event=>{if(event.target.id==="confirmReset"){state=newState();persist();dialog.close();render();}});
render();
</script>
