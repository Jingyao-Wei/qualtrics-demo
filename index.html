  mentalHealthPending: "Definition follows the primary PHQ-2/GAD-2 index in the current analysis code. Confirm that this is the final survey outcome before fielding. The meeting agreed a response range of −0.50 to +0.50 SD."
};
const COLORS = {
  stable: {short:"S–C",label:"Stable − Control",fill:"#f0cc3e",stroke:"#897015",shape:"circle"},
  unstable: {short:"U–C",label:"Unstable − Control",fill:"#6186b3",stroke:"#36587b",shape:"diamond"},
  predictable: {short:"P–C",label:"Predictable − Control",fill:"#bc2d43",stroke:"#882034",shape:"square"},
  risky: {short:"R–C",label:"Risky − Control",fill:"#438761",stroke:"#255638",shape:"triangle"},
  matched: {short:"P–R",label:"Matched calendars: Predictable − Risky",fill:"#7756a4",stroke:"#523377",shape:"diamond"},
  early: {short:"Early: P–R",label:"Early-income calendars: P − R",fill:"#ce833b",stroke:"#90551f",shape:"circle"},
  late: {short:"Late: P–R",label:"Late-income calendars: P − R",fill:"#6578b4",stroke:"#3b4f88",shape:"square"}
};
const PANELS = [
  {id:"MH_slider_1",enabled:false,section:"Mental health",title:"Stable and unstable income",unit:"Standard deviation changes relative to Control",unitCode:"sd",series:[COLORS.stable,COLORS.unstable],
   description:"How much higher or lower will the mental-health index be in the Stable arm and the pooled Unstable group compared with Control?",
   explanation:"Enter one coefficient for each pooled reference window. A value of 0.20 means the mental-health index is 0.20 standard deviations higher than in Control. The direction of better mental health depends on the index's scoring; that direction is not specified in this draft."},
  {id:"MH_slider_2",enabled:true,section:"Mental health",title:"Mental health",unit:"Standard deviation changes relative to Control",unitCode:"sd",series:[COLORS.stable,COLORS.predictable,COLORS.risky],
   description:"How much better or worse will mental health be in each treatment arm compared with Control?",
   explanation:"Enter three separate treatment–control differences in standard deviations. Positive values mean better mental health in the treatment arm; negative values mean worse mental health. These differences do not have to add up to anything."},
  {id:"MH_slider_3",context:"A work schedule is the number of bags assigned in each of the six periods. Here, matching means the same number in Period 1, the same number in Period 2, and so on through Period 6. Predictable participants know their whole schedule from the start. Risky participants discover each period’s assignment at its start. Compare assigned work, not necessarily completed work.",enabled:false,section:"Mental health",title:"Compare matched work calendars",unit:"Standard deviation difference: Predictable minus Risky",unitCode:"sd",series:[COLORS.matched],draft:true,
   description:"How much better or worse will mental health be in the Predictable arm compared with the Risky arm when participants were assigned the same number of bags in every period?",
   explanation:"Compare the Predictable and Risky groups within the same six-period sequence of assigned bags. Enter Predictable minus Risky in standard deviations: positive means better mental health in Predictable, and negative means worse. The matching and estimation rules remain for the PI meeting.",
   draftNote:"Working interpretation of MH_slider_3. The document requests matched calendars but does not define the exact coefficient. This draft uses Predictable − Risky within matched realized calendars."},
  {id:"MH_slider_4",context:"Use the same matching rule as the previous page: the assigned number of bags must match in every period. For this proposal, each schedule has three periods with 15 bags and three with 3 bags. Earlier means at least two 15-bag periods fall in Periods 1–3; later means at least two fall in Periods 4–6. These definitions are provisional for PI discussion.",enabled:false,section:"Mental health",title:"Income timing and anticipation",unit:"Standard deviation difference: Predictable minus Risky",unitCode:"sd",series:[COLORS.early,COLORS.late],draft:true,
   description:"How much better or worse will mental health be in the Predictable arm compared with the Risky arm when their assigned work schedules match, separately for schedules with more work earlier and later?",
   explanation:"Within each timing group, compare Predictable and Risky participants assigned the same number of bags in every period. Enter Predictable minus Risky in standard deviations: positive means better mental health in Predictable, and negative means worse. This proposed split does not by itself isolate optimism or dread. The timing definition and estimator remain for the PI meeting.",
   draftNote:"Working interpretation of MH_slider_4, for discussion. Early- versus late-income calendars are an editable way to explore anticipation. The document does not yet specify the optimism/dread measure."},
  {id:"CON_slider_1_log",proposalVersion:1,proposalLabel:"Log points",preferredBy:"HS",documentLabel:"CON_slider_1",enabled:false,section:"Consumption",title:"Household consumption",unit:"Log-point changes relative to Control",unitCode:"log_points",series:[COLORS.stable,COLORS.predictable,COLORS.risky],alternative:true,
   description:"How much higher or lower will total household consumption be in each treatment arm compared with Control, measured in log points?",
   explanation:"Enter log points: 0.10 log points corresponds to approximately 10.5% higher consumption. −0.10 corresponds to approximately 9.5% lower consumption. Zero means no difference. This is a linear axis measured in log points, not a logarithmic axis."},
  {id:"CON_slider_1_sd",proposalVersion:2,proposalLabel:"Standard deviations",documentLabel:"CON_slider_1",enabled:false,section:"Consumption",title:"Household consumption",unit:"Standard deviation changes relative to Control",unitCode:"sd",series:[COLORS.stable,COLORS.predictable,COLORS.risky],alternative:true,
   description:"How much higher or lower will total household consumption be in each treatment arm compared with Control, measured in standard deviations?",
   explanation:"Enter standard deviation units: 0.20 means consumption is 0.20 standard deviations higher than in Control. −0.20 means it is 0.20 standard deviations lower. The reference sample and standardization of consumption need to be specified before fielding this version."},
  {id:"CON_slider_1_proportion",proposalVersion:3,proposalLabel:"Proportional changes",documentLabel:"CON_slider_1",enabled:false,section:"Consumption",title:"Household consumption",unit:"Proportional changes relative to Control",unitCode:"proportion",series:[COLORS.stable,COLORS.predictable,COLORS.risky],alternative:true,
   description:"How much higher or lower will total household consumption be in each treatment arm compared with Control, expressed as a proportional change?",
   explanation:"Enter a proportion, not a whole-number percentage: 0.10 means 10% higher consumption, −0.10 means 10% lower, and 0 means no difference. The scale −1 to +1 corresponds to −100% to +100%."}
  ,{id:"CON_levels",enabled:true,section:"Consumption",title:"Household consumption",unit:"GHC per household per two-week period",unitCode:"ghc_per_household_two_weeks",money:true,min:-100,max:100,tick:50,step:1,
   series:[COLORS.stable,COLORS.predictable,COLORS.risky],
   description:"How much higher or lower will average household consumption be in each treatment arm compared with Control, in Ghana cedis (GHC) per two-week period?",

  {id:"CON_high_low",enabled:true,section:"Consumption",title:"High versus low work periods",unit:"GHC per household per two-week period",unitCode:"ghc_per_household_two_weeks",money:true,min:-100,max:100,tick:50,step:1,windows:["1–6"],windowHeading:"Study periods",draft:true,
   series:[{...COLORS.predictable,short:"Predictable: high − low",label:"Predictable: high − low"},{...COLORS.risky,short:"Risky: high − low",label:"Risky: high − low"}],
   context:"Compare periods with 15 assigned bags (high work) with periods with 3 assigned bags (low work), separately within Predictable and Risky. Predictable participants know the full schedule in advance; Risky participants learn each assignment at the start of that period.",
   description:"Within each arm, how much higher or lower is average household consumption in high-work periods than in low-work periods?",
   explanation:"Enter high-work minus low-work consumption in GHC per household per two-week period, separately for Predictable and Risky. Zero means equal average consumption in high- and low-work periods. A negative answer means consumption is lower in high-work periods. This comparison is within each arm, not relative to Control, and uses observations across all six periods.",
   draftNote:"Meeting proposal implemented for review: one high-minus-low estimate per arm across all six periods. Confirm the estimation sample, adjustment for period effects, and whether to use total consumption or food spending before fielding."}
];

const MECHANISMS = [
  {id:"consumption_level",label:"How much households can consume"},
  {id:"consumption_variation",label:"How much consumption varies across time"},
  {id:"planning_effort",label:"The mental effort of planning spending and managing changing income"},
  {id:"expectations",label:"Expectations or worries about future income"}
];
const RATINGS = ["Not at all", "Slightly", "Moderately", "Very", "Extremely", "Unsure"];

const enabledPanels = PANELS.filter(panel=>panel.enabled);
const infoScreens = ["welcome","instructions","tutorial"];
const PRACTICE_PANEL = {
  id:"tutorial",title:"Practice score",unit:"Practice difference (fictional units)",
  series:[{...COLORS.stable,short:"Example A",label:"Example A"},{...COLORS.predictable,short:"Example B",label:"Example B"},{...COLORS.risky,short:"Example C",label:"Example C"}]
};
const screen = document.getElementById("screen");
const navigation = document.getElementById("navigation");
const dialog = document.getElementById("referenceDialog");
const STORAGE_KEY = "sspp-slider-demo-" + SETTINGS.version + "-" + enabledPanels.map(panel=>panel.id).join("-");
let resizeObserver = null;

function newState() {
  return {version:SETTINGS.version,startedAt:new Date().toISOString(),phase:"first",index:0,browseIndex:null,first:{},drafts:{},revised:{},revisionDrafts:{},practice:{values:Array(9).fill(""),tasks:[false,false,false],completedAt:null},mechanismDraft:{ratings:{},other:"",otherRating:"",selected:[],details:{}},mechanisms:null,mechanismExplanationSavedAt:null,demographicDraft:{age:"",country:"",discipline:"",title:""},demographics:null,informationSeenAt:null,revisionSelection:null,revisionRequested:null,revisionChoiceAt:null,finishedAt:null};
}
function loadState() {
  try {
    const saved=JSON.parse(sessionStorage.getItem(STORAGE_KEY));
    if (saved && saved.version===SETTINGS.version) return saved;
  } catch (_) { /* The demo also works when browser storage is unavailable. */ }
  return newState();
}
let state=loadState();
function persist() {
  try { sessionStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
  catch (_) { document.getElementById("storageNotice").textContent=" Browser storage is unavailable; keep this page open or download your answers."; }
}
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
}
function format(value) { return (Math.abs(value)<0.000001?0:value).toFixed(2); }
function panelWindows(panel) { return panel.windows||SETTINGS.windows; }
function parseAnswer(raw,panel=PRACTICE_PANEL) {
  const text=String(raw).trim();
  if (!text) return {value:null,error:"",valid:false};
  if (!/^[+-]?(?:\d+(?:[.,]\d*)?|[.,]\d+)$/.test(text)) return {value:null,error:"Enter a number.",valid:false};

function plotRange(panel,raw) {

las Grandstaff<br><strong>Corresponding author:</strong> Heather Schofield; hws44@cornell.edu</p><p>The supplied study introduction states that the study has IRB approval from Ghana Health Services, the National Institute of Health, the Norwegian School of Economics, Cornell University, the University of Pennsylvania, the University of Southern California, and the World Bank. It describes minimal risks, compensation for participants' time, informed consent before enrollment, and de-identified personal information stored securely.</p><p>The draft survey takes about ten minutes. Predictions will be analyzed as part of an academic project. The draft describes anonymous responses and the option to withdraw by exiting before the end of the survey.</p><p><strong>In this demonstration, continuing only starts the demo; no research consent or response is submitted.</strong></p></details>`;

function svgElement(tag,attrs,parent,text) {
  const node=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const [key,value] of Object.entries(attrs||{})) node.setAttribute(key,value);
  if(text!==undefined) node.textContent=text;
  parent.appendChild(node);return node;
}
function drawShape(parent,series,x,y,fill) {
  const attrs={fill,stroke:series.stroke,"stroke-width":2};
  if(series.shape==="circle") return svgElement("circle",{...attrs,cx:x,cy:y,r:7},parent);
  if(series.shape==="square") return svgElement("rect",{...attrs,x:x-7,y:y-7,width:14,height:14},parent);
  if(series.shape==="triangle") return svgElement("polygon",{...attrs,points:`${x},${y-9} ${x-9},${y+7} ${x+9},${y+7}`},parent);
  return svgElement("polygon",{...attrs,points:`${x},${y-9} ${x-8},${y} ${x},${y+9} ${x+8},${y}`},parent);
}
function drawLegend(target,series) {

}
function drawPlot(target,panel,raw,interactive,onChange) {

  target.parentElement.style.setProperty("--comparison-width",left+"px");

  const windows=panelWindows(panel);
  const y=value=>bottom-(value-min)/(max-min)*(bottom-top);
  const svg=svgElement("svg",{viewBox:`0 0 ${width} ${height}`,role:"group","aria-label":panel.section||panel.title||"Assigned study income"},target);
  if(panel.unit) svgElement("text",{transform:`translate(${left-68} ${(top+bottom)/2}) rotate(-90)`,"text-anchor":"middle","font-size":11,fill:"#596b79"},svg,panel.unit);
  for(let i=0;min+i*tick<=max+0.000001;i++) {
    const value=min+i*tick;
    svgElement("line",{x1:left,x2:right,y1:y(value),y2:y(value),stroke:Math.abs(value)<0.000001?"#788895":"#e4e8ec","stroke-width":Math.abs(value)<0.000001?1.5:1},svg);
    svgElement("text",{x:left-9,y:y(value)+4,"text-anchor":"end","font-size":12,fill:"#596b79"},svg,max>2?String(Math.round(value)):format(value));
  }
  const groupWidth=(right-left)/windows.length;
  windows.forEach((window,r)=>{
    const x=left+(r+.5)*groupWidth;
    svgElement("text",{x,y:48,"text-anchor":"middle","font-size":14,fill:"#344e62"},svg,window);
  });
  svgElement("text",{x:(left+right)/2,y:22,"text-anchor":"middle","font-size":13,fill:"#344e62"},svg,panel.windowHeading||"Cumulative periods");
  const nodes=[];
  raw.forEach((value,i)=>{
    const r=Math.floor(i/panel.series.length),s=i%panel.series.length,series=panel.series[s];
    const spacing=Math.min(width<500?22:32,(groupWidth-8)/panel.series.length);
    const x=left+(r+.5)*groupWidth+(s-(panel.series.length-1)/2)*spacing;
    const label=`Periods ${windows[r]}, ${series.label}`;
    const group=svgElement("g",interactive?{class:"handle",tabindex:0,role:"slider","aria-label":label,"aria-orientation":"vertical","aria-valuemin":min,"aria-valuemax":max}:{role:"img","aria-label":label},svg);
    const title=svgElement("title",{},group,label);
    if(interactive) svgElement("rect",{x:-spacing/2,y:-21,width:spacing,height:42,rx:4,fill:"transparent",class:"hit"},group);
    const symbol=drawShape(group,series,0,0,series.fill);
    nodes.push({group,symbol,title,x,label,series});
    if(!interactive) return;
    let drag=null;
    function pointValue(event) { const point=svg.createSVGPoint();point.x=event.clientX;point.y=event.clientY;const local=point.matrixTransform(svg.getScreenCTM().inverse());return min+(bottom-local.y)/(bottom-top)*(max-min); }
    function setValue(value) { onChange(i,value===null?"":format(Math.max(min,Math.min(max,Math.round(value*100)/100))),"marker"); }
    group.addEventListener("pointerdown",event=>{if(event.button!==0)return;event.preventDefault();group.focus();group.setPointerCapture(event.pointerId);const answer=parseAnswer(raw[i],panel);drag={id:event.pointerId,start:pointValue(event),value:answer.valid?answer.value:0};setValue(drag.value);});
    group.addEventListener("pointermove",event=>{if(drag&&drag.id===event.pointerId)setValue(drag.value+pointValue(event)-drag.start);});
    ["pointerup","pointercancel","lostpointercapture"].forEach(type=>group.addEventListener(type,event=>{if(drag&&drag.id===event.pointerId)drag=null;}));
    group.addEventListener("keydown",event=>{
      const parsed=parseAnswer(raw[i],panel);let value=parsed.valid?parsed.value:0;const step=(panel.step??SETTINGS.step)*(event.shiftKey?10:1);
      if(event.key==="ArrowUp"||event.key==="ArrowRight")value+=step;
      else if(event.key==="ArrowDown"||event.key==="ArrowLeft")value-=step;
      else if(event.key==="Home")value=min;
      else if(event.key==="End")value=max;
      else if(event.key==="Delete"||event.key==="Backspace")value=null;
      else if(event.key!=="Enter"&&event.key!==" ")return;
      event.preventDefault();setValue(value);
    });
  });
  function refresh() {
    nodes.forEach((node,i)=>{
      const parsed=interactive?parseAnswer(raw[i],panel):{valid:raw[i]!==null,value:raw[i]};
      const value=parsed.valid?parsed.value:0;
      node.group.setAttribute("transform",`translate(${node.x},${y(value)})`);
      node.symbol.setAttribute("fill",parsed.valid?node.series.fill:"white");
      node.symbol.setAttribute("stroke-dasharray",parsed.valid?"none":"3 2");
      node.group.setAttribute("aria-valuenow",value);
      node.group.setAttribute("aria-valuetext",parsed.valid?(max>2?String(value):format(value)):"Not answered; starting position zero");
      node.title.textContent=node.label+": "+(parsed.valid?(max>2?String(value):format(value)):"not answered");
    });
  }
  refresh();return refresh;
}

function mountAnswerInterface(panel,raw,onUpdate) {
  // DOM rows are comparisons; response arrays remain indexed by window then comparison.
  const inputs=Array.from(screen.querySelectorAll(".estimate")).sort((a,b)=>Number(a.dataset.cell)-Number(b.dataset.cell));

    inputs.forEach((input,i)=>{const parsed=parseAnswer(raw[i],panel);if(parsed.valid)answered++;if(parsed.error&&!firstError)firstError=`Periods ${panelWindows(panel)[Math.floor(i/panel.series.length)]}, ${panel.series[i%panel.series.length].short}: ${parsed.error}`;input.setAttribute("aria-invalid",parsed.error?"true":"false");input.setCustomValidity(parsed.error);});

function commitPanel(panel) {
  // Navigation back must never resubmit or overwrite either saved round.
  if(state.browseIndex!==null||(state.phase==="revision"?state.revised:state.first)[panel.id])return;
  const raw=rawFor(panel),parsed=raw.map(value=>parseAnswer(value,panel));
  if(parsed.some(value=>!value.valid))return;
  const record={values:parsed.map(value=>value.value),savedAt:new Date().toISOString()};
  if(state.phase==="revision")state.revised[panel.id]=record;
  else if(!state.first[panel.id])state.first[panel.id]=record;
  state.index++;
  if(state.phase==="revision"&&state.index>=enabledPanels.length)state.phase="demographics";
  persist();render();
}

function csvData(data) {
  const rows=[["panel_id","document_label","unit","proposed_contrast","reference_window","comparison","first_answer","revised_answer","final_answer","changed","revision_requested","first_saved_at","revised_saved_at","revision_choice_at","additional_information_provided","additional_information_seen_at","age","country_of_residence","discipline","professional_title"]];
  data.panels.forEach(panel=>panel.responses.forEach(response=>rows.push([panel.id,panel.document_label,panel.unit,panel.proposed,response.window,response.contrast,response.first,response.revised,response.final,response.changed,data.revision_requested,panel.first_saved_at,panel.revised_saved_at,data.revision_choice_at,data.additional_information.provided,data.additional_information.seen_at,data.demographics?.age,data.demographics?.country,data.demographics?.discipline,data.demographics?.title])));
  return '\ufeff'+rows.map(row=>row.map(csvCell).join(",")).join("\r\n");
}

function csvCell(value) {
  let text=String(value??"");
  if(typeof value!=="number"&&/^[=+@\-\t\r]/.test(text))text="'"+text;
  return '"'+text.replace(/"/g,'""')+'"';
}
function mechanismCSV(data) {
  const m=data.mechanisms;
  const rows=[["reason_id","reason","importance_code","importance_label","explanation","ratings_saved_at","explanation_saved_at"]];
  if(m){
    m.items.forEach(item=>rows.push([item.id,item.label,m.ratings[item.id],m.rating_labels[Number(m.ratings[item.id])],m.details[item.id]||'',m.savedAt,m.explanation_saved_at]));
    if(m.other)rows.push(["other",m.other,m.otherRating,m.rating_labels[Number(m.otherRating)],m.details.other||'',m.savedAt,m.explanation_saved_at]);
  }
  return '\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');
}

document.getElementById("faqButton").onclick=()=>openDialog("FAQ & reference",`<div class="faq-body"><h2>What do the treatment arms mean?</h2><p>Control receives no study work. Stable receives 9 bags every period. Predictable receives 3 bags in three periods and 15 in three periods, with the whole schedule known in advance. Risky receives 3 or 15 bags with equal probability, revealed at the start of each period.</p><h2>What are participants doing?</h2><p>Stitching bags at home with flexible hours, at roughly two hours per bag. The piece rate is constant across treatment arms. Stable and Predictable schedules were explained with comprehension questions. Risky assignments were revealed by scratchcards.</p><h2>What do 1–2, 1–4, and 1–6 mean?</h2><p>They include observations from the first two, first four, and all six two-week periods. Each longer window includes earlier periods. Predict an average difference using those observations; do not add coefficients or total spending across periods. The high-versus-low comparison uses all six periods.</p><h2>Which units should I enter?</h2><p>Mental health uses standard deviations from −0.50 to +0.50. Consumption uses differences in Ghana cedis (GHC) per household per two-week period, not logs, percentages, or standard deviations. Its starting graph range is provisional and expands to include typed amounts.</p><h2>What is the mental-health index?</h2><p>${escapeHTML(SETTINGS.mentalHealthDefinition)}</p><details><summary>Technical definition and review status</summary><p>The current analysis uses an inverse-covariance-weighted PHQ-2/GAD-2 index, with symptom scales reversed and the combined index standardized to the Control group at baseline.</p><p>${escapeHTML(SETTINGS.mentalHealthPending)}</p></details>${implementationHTML()}<h2>Why ask about high- and low-work periods?</h2><p>This asks whether consumption differs between periods with 15 versus 3 assigned bags, separately for Predictable and Risky. It is a within-arm comparison, not a treatment–Control effect. The precise estimation sample and consumption definition remain under review.</p><h2>Can I go back?</h2><p>Yes. Back revisits earlier pages and preserves unfinished entries. Submitted predictions, ratings, explanations and the revision decision are read-only. Return to current page resumes where you left off.</p><h2>What happens if I revise?</h2><p>After the additional-information step, you can revise the three numerical prediction pages. Your first answers stay locked. Ratings and explanations are collected once. If the information page is still marked pending, the demo has provided no new study evidence.</p><h2>Are my answers sent anywhere?</h2><p>No. Answers are saved in this browser tab where supported. Download numerical answers and reasons as CSV, or the full record as JSON. This prototype is not yet connected to Qualtrics.</p></div>`);
document.getElementById("reviewButton").onclick=()=>openDialog("Your locked first answers",'<p class="small muted">Read-only. The optional revision round records new values separately.</p>'+summaryHTML(false)+mechanismSummaryHTML());
document.getElementById("closeDialog").onclick=()=>dialog.close();
document.getElementById("resetButton").onclick=()=>openDialog("Start a new demo?",'<p>This clears the answers stored for this demo in this browser tab. Download your completed answers first if you want to keep them.</p><button class="primary" id="confirmReset">Clear answers and restart</button>');
document.getElementById("dialogBody").addEventListener("click",event=>{if(event.target.id==="confirmReset"){state=newState();persist();dialog.close();render();}});
render();
</script>
</body>
</html>
