*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,sans-serif}button,input,select{font:inherit}button,a,input{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #2c73b3;outline-offset:3px}a{color:var(--navy)}.shell{max-width:1040px;margin:0 auto;padding:26px 26px 40px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.brand{font-weight:700;letter-spacing:.1px}.version{font-size:12px;display:block;color:var(--muted);font-weight:400}.top-actions{display:flex;gap:8px;align-items:center}.quiet{background:white;border:1px solid var(--line);padding:9px 14px;border-radius:7px;color:var(--navy);min-height:42px}.demo-strip{font-size:13px;color:var(--muted);margin:0 0 20px}.progress-head{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:8px}.progress{height:4px;background:#e1e6ea;border-radius:4px;margin-bottom:24px;overflow:hidden}.progress>span{height:100%;display:block;background:var(--navy);transition:width .2s}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:30px 38px;min-height:420px}.kicker{color:var(--navy);font-size:12px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:9px}h1{font-size:28px;line-height:1.2;letter-spacing:-.5px;margin:0 0 18px}h2{font-size:19px;line-height:1.35;margin:26px 0 12px}h3{font-size:17px;margin:16px 0 6px}p{margin:0 0 15px}.lead{font-size:18px;line-height:1.6}.muted{color:var(--muted)}.small{font-size:13px}.prose{max-width:780px}.meta{font-size:13px;color:var(--muted);margin-top:18px}.draft-note{background:#fff5df;border:1px solid #ead7a6;border-radius:7px;padding:11px 14px;font-size:14px;margin:15px 0}.draft-tag{font-size:11px;letter-spacing:.4px;background:#fff2d3;color:#725416;padding:4px 8px;border-radius:4 display:block;padding:24px;background:#fff2d3}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:650px){.shell{padding:18px 12px 30px}.topbar{align-items:flex-start}.brand{font-size:15px;max-width:180px}.quiet{padding:8px 10px;font-size:13px}.top-actions{gap:5px}.card{padding:22px 15px;border-radius:9px}h1{font-size:24px}.lead{font-size:16px}.arms{grid-template-columns:1fr}.next-row{align-items:stretch;flex-direction:column}.primary{width:100%}.window-explain{gap:7px}.window-explain div{padding:14px 5px}th,td{padding:7px 4px}.estimate{min-width:55px;padding:6px 2px}.legend{gap:6px 12px;justify-content:flex-start}.demo-strip{font-size:12px}.dialog-head{padding:14px 16px}.dialog-body{padding:8px 16px 20px}.unit-label{font-size:12px}.download-row button{flex:1}.progress-head{font-size:12px}.plot-help{font-size:12px}}

/* Keep the graph windows and table columns aligned, including on phones. */
.prediction-interface{--comparison-width:88px}
.plot-title{text-align:center;padding-left:var(--comparison-width);font-size:21px;margin:22px 0 0;letter-spacing:0}
.prediction-question{font-size:18px;line-height:1.5;margin-bottom:12px}
.estimate-table{table-layout:fixed;margin:0 0 16px}
.estimate-table .comparison-column{width:var(--comparison-width,24%)}
.estimate-table th[scope=row]{white-space:normal;font-size:13px;padding-left:0}

.row-comparison{display:flex;align-items:center;gap:6px;line-height:1.3}

@media(max-width:650px){.prediction-question{font-size:16px}.plot-title{font-size:19px}.estimate-table th[scope=row]{font-size:11px}.row-comparison{gap:3px}.row-comparison svg{width:16px;height:16px}.estimate-table .estimate{min-width:0}.legend{font-size:12px;justify-content:center}.legend svg{width:18px;height:18px}.estimate-table th,.estimate-table td{padding-left:3px;padding-right:3px}}

.nav-controls{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;flex:none}
.next-row{flex-wrap:wrap}.next-row>p{flex:1;min-width:230px}
.locked-note{background:#edf4f8;border-left:3px solid var(--navy);padding:12px 15px;font-size:14px;margin-bottom:18px}
@media(max-width:650px){.nav-controls{width:100%}.nav-controls button{flex:1 1 auto}.nav-controls .primary{width:auto}.nav-controls #returnButton{flex-basis:100%;order:3}.next-row>p{min-width:0}}
</style>

<body>
<noscript>This interactive demo needs JavaScript enabled in your browser.</noscript>
<div class="shell">
  <header class="topbar"><div class="brand">Income stability &amp; health<span class="version">Prediction survey · 16 October 2026 PI review</span></div><div class="top-actions"><button class="quiet" id="reviewButton" hidden>First answers</button><button class="quiet" id="faqButton">FAQ &amp; reference</button></div></header>
  <p class="demo-strip">Interactive demo · answers stay in this browser tab and can be downloaded. Nothing is submitted.</p>
  <div class="progress-head"><span id="phaseLabel"></span><span id="stepLabel"></span></div><div class="progress"><span id="progressFill"></span></div>
  <main id="screen" class="card" tabindex="-1"></main>
  <div id="navigation" class="next-row"></div>
  <footer class="footer">Study design prototype. Proposed content is labelled on the relevant pages. <button id="resetButton">Start a new demo</button><span id="storageNotice"></span></footer>
</div>
<dialog id="referenceDialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="quiet" id="closeDialog" aria-label="Close reference">Close</button></div><div id="dialogBody" class="dialog-body"></div></dialog>
<script>
"use strict";

// DEMO SETTINGS: turn enabled to false to remove an unwanted consumption page.
// This standalone demo does not submit data to Qualtrics or any other service.
const SETTINGS = {
  version: "2026-10-16-v7",
  min: -1, max: 1, tick: 0.5, step: 0.01,
  windows: ["1–2", "1–4", "1–6"],
  // PIs will approve these study details at the meeting. Blank means not supplied.
  additionalInformation: "",
  mentalHealthDefinition: "The mental-health index combines measures of stress and anxiety into one score for each participant. This draft presents higher scores as better mental health. Enter differences in standard deviations (SD): positive values mean better mental health in the named arm; negative values mean worse mental health; zero means no difference.",
  mentalHealthPending: "For PI confirmation: the exact questionnaire items, index construction, scoring direction, and reference sample used to define one standard deviation. The current −1 to +1 slider range is also awaiting the meeting decision; its endpoints are not suggested effects."
};
const COLORS = {
  stable: {short:"S–C",label:"Stable − Control",fill:"#f0cc3e",stroke:"#897015",shape:"circle"},
  unstable: {short:"U–C",label:"Unstable − Control",fill:"#6186b3",stroke:"#36587b",shape:"diamond"},
  predictable: {short:"P–C",label:"Predictable − Control",fill:"#bc2d43",stroke:"#882034",shape:"square"},
  risky: {short:"R–C",label:"Risky − Control",fill:"#438761",stroke:"#255638",shape:"triangle"},
  matched: {short:"P–R",label:"Matched calendars: Predictable − Risky",fill:"#7756a4",stroke:"#523377",shape:"diamond"},
  early: {short:"Early: P–R",label:"Early-income calendars: P − R",fill:"#ce833b",stroke:"#90551f",shape:"circle"},
  late: {short:"Late: P–R",label:"Late-income calendars: P − R",fill:"#6578b4",stroke:"#3b4f88",shape:"square"}
};
const PANELS = [
  {id:"MH_slider_1",enabled:false,section:"Mental health",title:"Stable and unstable income",unit:"Standard deviation changes relative to Control",unitCode:"sd",series:[COLORS.stable,COLORS.unstable],
   description:"How much higher or lower will the mental-health index be in the Stable arm and the pooled Unstable group compared with Control?",
   explanation:"Enter one coefficient for each pooled reference window. A value of 0.20 means the mental-health index is 0.20 standard deviations higher than in Control. The direction of better mental health depends on the index's scoring; that direction is not specified in this draft."},
  {id:"MH_slider_2",enabled:true,section:"Mental health",title:"Mental health",unit:"Standard deviation changes relative to Control",unitCode:"sd",series:[COLORS.stable,COLORS.predictable,COLORS.risky],
   description:"How much better or worse will mental health be in each treatment arm compared with Control?",
   explanation:"Enter three separate treatment–control differences in standard deviations. Positive values mean better mental health in the treatment arm; negative values mean worse mental health. These differences do not have to add up to anything."},
  {id:"MH_slider_3",context:"A work schedule is the number of bags assigned in each of the six periods. Here, matching means the same number in Period 1, the same number in Period 2, and so on through Period 6. Predictable participants know their whole schedule from the start. Risky participants discover each period’s assignment at its start. Compare assigned work, not necessarily completed work.",enabled:true,section:"Mental health",title:"Compare matched work calendars",unit:"Standard deviation difference: Predictable minus Risky",unitCode:"sd",series:[COLORS.matched],draft:true,
   description:"How much better or worse will mental health be in the Predictable arm compared with the Risky arm when participants were assigned the same number of bags in every period?",
   explanation:"Compare the Predictable and Risky groups within the same six-period sequence of assigned bags. Enter Predictable minus Risky in standard deviations: positive means better mental health in Predictable, and negative means worse. The matching and estimation rules remain for the PI meeting.",
   draftNote:"Working interpretation of MH_slider_3. The document requests matched calendars but does not define the exact coefficient. This draft uses Predictable − Risky within matched realized calendars."},
  {id:"MH_slider_4",context:"Use the same matching rule as the previous page: the assigned number of bags must match in every period. For this proposal, each schedule has three periods with 15 bags and three with 3 bags. Earlier means at least two 15-bag periods fall in Periods 1–3; later means at least two fall in Periods 4–6. These definitions are provisional for PI discussion.",enabled:true,section:"Mental health",title:"Income timing and anticipation",unit:"Standard deviation difference: Predictable minus Risky",unitCode:"sd",series:[COLORS.early,COLORS.late],draft:true,
   description:"How much better or worse will mental health be in the Predictable arm compared with the Risky arm when their assigned work schedules match, separately for schedules with more work earlier and later?",
   explanation:"Within each timing group, compare Predictable and Risky participants assigned the same number of bags in every period. Enter Predictable minus Risky in standard deviations: positive means better mental health in Predictable, and negative means worse. This proposed split does not by itself isolate optimism or dread. The timing definition and estimator remain for the PI meeting.",
   draftNote:"Working interpretation of MH_slider_4, for discussion. Early- versus late-income calendars are an editable way to explore anticipation. The document does not yet specify the optimism/dread measure."},
  {id:"CON_slider_1_log",proposalVersion:1,proposalLabel:"Log points",preferredBy:"HS",documentLabel:"CON_slider_1",enabled:true,section:"Consumption",title:"Household consumption",unit:"Log-point changes relative to Control",unitCode:"log_points",series:[COLORS.stable,COLORS.predictable,COLORS.risky],alternative:true,
   description:"How much higher or lower will total household consumption be in each treatment arm compared with Control, measured in log points?",
   explanation:"Enter log points: 0.10 log points corresponds to approximately 10.5% higher consumption. −0.10 corresponds to approximately 9.5% lower consumption. Zero means no difference. This is a linear axis measured in log points, not a logarithmic axis."},
  {id:"CON_slider_1_sd",proposalVersion:2,proposalLabel:"Standard deviations",documentLabel:"CON_slider_1",enabled:true,section:"Consumption",title:"Household consumption",unit:"Standard deviation changes relative to Control",unitCode:"sd",series:[COLORS.stable,COLORS.predictable,COLORS.risky],alternative:true,
   description:"How much higher or lower will total household consumption be in each treatment arm compared with Control, measured in standard deviations?",
   explanation:"Enter standard deviation units: 0.20 means consumption is 0.20 standard deviations higher than in Control. −0.20 means it is 0.20 standard deviations lower. The reference sample and standardization of consumption need to be specified before fielding this version."},
  {id:"CON_slider_1_proportion",proposalVersion:3,proposalLabel:"Proportional changes",documentLabel:"CON_slider_1",enabled:true,section:"Consumption",title:"Household consumption",unit:"Proportional changes relative to Control",unitCode:"proportion",series:[COLORS.stable,COLORS.predictable,COLORS.risky],alternative:true,
   description:"How much higher or lower will total household consumption be in each treatment arm compared with Control, expressed as a proportional change?",
   explanation:"Enter a proportion, not a whole-number percentage: 0.10 means 10% higher consumption, −0.10 means 10% lower, and 0 means no difference. The scale −1 to +1 corresponds to −100% to +100%."}
];

const enabledPanels = PANELS.filter(panel=>panel.enabled);
const infoScreens = ["welcome","design","compliance","income","instructions","tutorial"];
const PRACTICE_PANEL = {
  id:"tutorial",title:"Practice score",unit:"Practice difference (fictional units)",
  series:[{...COLORS.stable,short:"Example A",label:"Example A"},{...COLORS.predictable,short:"Example B",label:"Example B"},{...COLORS.risky,short:"Example C",label:"Example C"}]
};
const screen = document.getElementById("screen");
const navigation = document.getElementById("navigation");
const dialog = document.getElementById("referenceDialog");
const STORAGE_KEY = "sspp-slider-demo-" + SETTINGS.version + "-" + enabledPanels.map(panel=>panel.id).join("-");
let resizeObserver = null;

function newState() {
  return {version:SETTINGS.version,startedAt:new Date().toISOString(),phase:"first",index:0,browseIndex:null,first:{},drafts:{},revised:{},revisionDrafts:{},practice:{values:Array(9).fill(""),tasks:[false,false,false],completedAt:null},informationSeenAt:null,revisionSelection:null,revisionRequested:null,revisionChoiceAt:null,finishedAt:null};
}
function loadState() {
  try {
    const saved=JSON.parse(sessionStorage.getItem(STORAGE_KEY));
    if (saved && saved.version===SETTINGS.version) return saved;
  } catch (_) { /* The demo also works when browser storage is unavailable. */ }
  return newState();
}
let state=loadState();
function persist() {
  try { sessionStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
  catch (_) { document.getElementById("storageNotice").textContent=" Browser storage is unavailable; keep this page open or download your answers."; }
}
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
}
function format(value) { return (Math.abs(value)<0.000001?0:value).toFixed(2); }
function parseAnswer(raw) {
  const text=String(raw).trim();
  if (!text) return {value:null,error:"",valid:false};
  if (!/^[+-]?(?:\d+(?:[.,]\d*)?|[.,]\d+)$/.test(text)) return {value:null,error:"Enter a number.",valid:false};
  const value=Number(text.replace(",","."));
  if (!Number.isFinite(value)||value<SETTINGS.min||value>SETTINGS.max) return {value:null,error:"Enter a value between −1.00 and +1.00.",valid:false};
  if (Math.abs(value*100-Math.round(value*100))>0.000001) return {value:null,error:"Use up to two decimal places.",valid:false};
  return {value:value===0?0:value,error:"",valid:true};
}
function rawFor(panel) {
  const target=state.phase==="revision"?state.revisionDrafts:state.drafts;
  if (!target[panel.id]) target[panel.id]=state.phase==="revision"?state.first[panel.id].values.map(format):Array(SETTINGS.windows.length*panel.series.length).fill("");
  return target[panel.id];
}
function currentSteps(phase=state.phase) { return phase==="revision"?enabledPanels.map(p=>p.id):infoScreens.concat(enabledPanels.map(p=>p.id),["additional-information","revision-choice"]); }
// Survey progress stays at the current unanswered page while an earlier page is viewed.
function activePosition() {
  if(state.phase==="first")return state.index;
  return currentSteps("first").length+(state.phase==="revision"?state.index:(state.revisionRequested?enabledPanels.length:0));
}
function viewPosition() { return state.browseIndex??activePosition(); }
function viewLocation() {
  const position=viewPosition(),firstSteps=currentSteps("first");
  if(position<firstSteps.length)return {phase:"first",index:position,id:firstSteps[position]};
  const index=position-firstSteps.length;
  if(state.revisionRequested&&index<enabledPanels.length)return {phase:"revision",index,id:enabledPanels[index].id};
  return {phase:"finished",index:0,id:"summary"};
}
function goBack() {
  if(viewPosition()===0)return;
  state.browseIndex=viewPosition()-1;persist();render();
}
function returnToCurrent() { state.browseIndex=null;persist();render(); }
function setNavigation(label,handler,note,disabled=false) {
  navigation.innerHTML='<p>'+escapeHTML(note||"")+'</p><div class="nav-controls">'+(viewPosition()>0?'<button class="secondary" id="backButton">← Back</button>':"")+(state.browseIndex!==null?'<button class="quiet" id="returnButton">Return to current page</button>':"")+(label?'<button class="primary" id="nextButton">'+escapeHTML(label)+'</button>':"")+'</div>';
  const next=document.getElementById("nextButton");
  if(next){next.disabled=disabled;next.addEventListener("click",handler);}
  document.getElementById("backButton")?.addEventListener("click",goBack);
  document.getElementById("returnButton")?.addEventListener("click",returnToCurrent);
}
function advanceInfo() {
  if(state.browseIndex!==null){
    state.browseIndex++;
    if(state.browseIndex>=activePosition())state.browseIndex=null;
  } else state.index++;
  persist();render();
}
function render() {
  if(resizeObserver) resizeObserver.disconnect();
  screen.replaceChildren();navigation.replaceChildren();
  document.getElementById("reviewButton").hidden=Object.keys(state.first).length===0;
  const location=viewLocation();
  if(location.phase==="finished") {
    document.getElementById("phaseLabel").textContent="Demo complete";
    document.getElementById("stepLabel").textContent="First and revised answers preserved";
    document.getElementById("progressFill").style.width="100%";
    renderSummary();screen.focus({preventScroll:true});window.scrollTo(0,0);return;
  }
  const steps=currentSteps(location.phase),id=location.id;
  document.getElementById("phaseLabel").textContent=(state.browseIndex!==null?"Reviewing earlier page · ":"")+(location.phase==="revision"?"Revision round":"First round");
  document.getElementById("stepLabel").textContent="Page "+(location.index+1)+" of "+steps.length;
  document.getElementById("progressFill").style.width=((location.index+1)/steps.length*100)+"%";
  const panel=enabledPanels.find(p=>p.id===id);
  if(panel) renderPanel(panel);
  else if(id==="tutorial") renderTutorial();
  else if(id==="revision-choice") renderRevisionChoice();
  else renderInfo(id);
  screen.focus({preventScroll:true});window.scrollTo(0,0);
}

function renderInfo(id) {
  if(id==="additional-information") {
    screen.innerHTML=`<div class="kicker">Before you consider revising</div><h1>Additional information</h1><p class="lead">Your first predictions are locked. This is where you will receive the study information to consider before deciding whether to revise them.</p><div id="additionalInformation" class="prose"></div><p>After reading this page, continue to the revision decision. Your first predictions will remain available for reference.</p>`;
    const content=document.getElementById("additionalInformation");
    if(SETTINGS.additionalInformation.trim()) {
      const paragraph=document.createElement("p");paragraph.style.whiteSpace="pre-line";paragraph.textContent=SETTINGS.additionalInformation;content.append(paragraph);
    } else {
      content.innerHTML='<div class="draft-note"><strong>Content pending the PI meeting.</strong> The study team will agree on the hypotheses, mechanism information, or results to reveal here. No new study evidence has been supplied in this demo. Continuing lets reviewers test the revision flow only.</div>';
    }
    setNavigation("Continue to revision decision →",()=>{if(state.browseIndex===null&&!state.informationSeenAt)state.informationSeenAt=new Date().toISOString();advanceInfo();},"First answers stay locked. Revisions are saved separately.");
  }
  if(id==="welcome") {
    screen.innerHTML=`<div class="kicker">About the study</div><h1>Predictions about a work programme in northern Ghana</h1><div class="prose"><p class="lead">This survey asks you to make predictions about a randomized controlled trial (n = 2,272) that took place in northern Ghana during the lean season, when little work is available.</p><p>The women who participated in the study were either surveyed only (Control) or offered work stitching bags (three treatment arms). The study lasted three months, divided into six two-week periods. All participants were surveyed every period, with baseline and endline surveys happening in person and the remaining surveys conducted by phone.</p><p>We will ask you to make predictions about the mental health and consumption patterns across the arms. Then, we will provide you with some additional information and the opportunity to revise your predictions.</p><p class="small muted">Review demo: the additional-information page is included, with its study content awaiting PI approval.</p><details><summary>Study information and draft consent text</summary><p><strong>Grant:</strong> 1R01AG076655-01<br><strong>Authors:</strong> Heather Schofield, Vincent Somville, Leandro Carvalho, Damien de Walque, Jingyao Wei, and Nicholas Grandstaff<br><strong>Corresponding author:</strong> Heather Schofield; hws44@cornell.edu</p><p>The supplied study introduction states that the study has IRB approval from Ghana Health Services, the National Institute of Health, the Norwegian School of Economics, Cornell University, the University of Pennsylvania, the University of Southern California, and the World Bank. It describes minimal risks, compensation for participants' time, informed consent before enrollment, and de-identified personal information stored securely.</p><p>The draft survey takes about ten minutes. Predictions will be analyzed as part of an academic project. The draft describes anonymous responses and the option to withdraw by exiting before the end of the survey.</p><p><strong>In this demonstration, continuing only starts the demo; no research consent or response is submitted.</strong></p></details></div><p class="meta">Mental health first · Consumption second · Optional revision</p>`;
    setNavigation("Start demo →",advanceInfo,"Start with the introduction, then complete the tutorial before making predictions.");
  }
  if(id==="design") {
    screen.innerHTML=`<div class="kicker">Study design</div><h1>Six periods, four study arms</h1><p class="lead">The work offered is stitching bags. Each bag takes roughly two hours to complete. Work is piece-rate at a constant payment per bag across all treatment arms.</p><p>In expectation, each treatment arm has the same total work and earnings over the 12-week study. What differs across treatment arms is whether the amount of work varies across time and what participants know about the work schedule in advance.</p><div class="arms"><div class="arm"><h2>Control</h2><p>No study work; participants are followed over the course of the study.</p></div><div class="arm s"><h2>Stable income</h2><p>The amount of work is held constant at 9 bags across all six periods. The schedule is known in advance and explained carefully at the beginning of the study with comprehension questions.</p></div><div class="arm p"><h2>Predictable income</h2><p>The amount of work varies across periods. Three of the six periods offer less work (3 bags) and three offer more work (15 bags), resulting in the same average level of work as the Stable group. The schedule is known in advance and explained carefully at the beginning of the study with comprehension questions.</p></div><div class="arm r"><h2>Risky income</h2><p>In each period, the participant has a 50–50 chance of less work (3 bags) or more work (15 bags). The draw is realized at the beginning of the period when the worker scratches a scratchcard to determine the amount of work that period.</p></div></div><p class="small muted">The Risky arm’s realized total can vary. At the beginning of the study, its expected total matches that of the Stable and Predictable arms.</p>`;
    setNavigation("Continue →",advanceInfo,"The FAQ remains available throughout the demo.");
  }
  if(id==="compliance") {
    screen.innerHTML=`<div class="kicker">Study implementation</div><h1>Compliance with assigned work</h1><div class="prose"><p class="lead">This information screen will summarize how closely participants followed their assigned work schedules.</p><div class="draft-note"><strong>Study figures to be added.</strong> The document requests a compliance briefing but provides no compliance rates or implementation results. This demo does not assume perfect compliance.</div><p>The final screen should report the assigned and completed work, payment delivery, and any meaningful differences across arms. It will help respondents distinguish the intended study design from what was implemented.</p><p>No prediction is requested on this screen.</p></div>`;
    setNavigation("Continue →",advanceInfo,"Information only; no answer is recorded here.");
  }
  if(id==="income") {
    screen.innerHTML=`<div class="kicker">Income reference</div><h1>Work offered over the full study</h1><div class="prose"><p>The payment per bag is constant across treatment arms. The totals below follow from the assigned-work design; they are not completed work or observed earnings.</p><div class="grid-wrap"><table><thead><tr><th scope="col">Arm</th><th scope="col">Bags over six periods</th></tr></thead><tbody><tr><th scope="row">Stable</th><td>54: 9 bags × 6 periods</td></tr><tr><th scope="row">Predictable</th><td>54: (3 bags × 3 periods) + (15 bags × 3 periods)</td></tr><tr><th scope="row">Risky</th><td>54 in expectation; the realized total can differ</td></tr></tbody></table></div><p>The Stable and Predictable arms have the same total assigned work. The Risky arm has the same expected total, but its realized total depends on the draws.</p><div class="draft-note"><strong>For the PI meeting.</strong> Agree on the income reference to show and supply the payment per bag, actual earnings, and household income and consumption benchmarks for the same time window. The earlier illustrative GHC chart is omitted pending that decision.</div><p>No prediction is requested on this screen.</p></div>`;
    setNavigation("Continue →",advanceInfo,"This reference screen does not ask for predictions.");
  }
  if(id==="instructions") {
    screen.innerHTML=`<div class="kicker">How predictions work</div><h1>Predict effects over three cumulative reference windows</h1><p class="lead">Each marker represents one estimated effect using observations pooled from the start of the study through the indicated period. The reference windows are cumulative: 1–4 includes Periods 1 and 2, and 1–6 includes all earlier periods.</p><div class="window-explain"><div><strong>1–2</strong><span>First four weeks</span></div><div><strong>1–4</strong><span>First eight weeks</span></div><div><strong>1–6</strong><span>All twelve weeks</span></div></div><div class="prose"><p>Drag the markers vertically, or enter numbers in the table. All markers start at zero but remain hollow until you explicitly answer. The current draft scale runs from −1 to +1; the PIs will confirm its range.</p><p>Cumulative refers to which periods enter the estimate. Do not add the coefficients across periods.</p><p><strong>First answers lock when you continue.</strong> Use Back to reread the introduction, practice again, or view locked predictions. Your unfinished entries are kept when you go back. Locked first answers remain unchanged; the optional revision round records a separate set of answers.</p><p>Mental health is measured for the individual. Consumption is measured for the household. This demo includes three alternative consumption pages so the team can choose between log points, standard deviations, and proportional changes.</p><p>After your first predictions, an additional-information page comes before the option to revise. Its content will be agreed by the PIs. This review demo shows the place for that information without inventing study results.</p></div>`;

function svgElement(tag,attrs,parent,text) {
  const node=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const [key,value] of Object.entries(attrs||{})) node.setAttribute(key,value);
  if(text!==undefined) node.textContent=text;
  parent.appendChild(node);return node;
}
function drawShape(parent,series,x,y,fill) {
  const attrs={fill,stroke:series.stroke,"stroke-width":2};
  if(series.shape==="circle") return svgElement("circle",{...attrs,cx:x,cy:y,r:7},parent);
  if(series.shape==="square") return svgElement("rect",{...attrs,x:x-7,y:y-7,width:14,height:14},parent);
  if(series.shape==="triangle") return svgElement("polygon",{...attrs,points:`${x},${y-9} ${x-9},${y+7} ${x+9},${y+7}`},parent);
  return svgElement("polygon",{...attrs,points:`${x},${y-9} ${x-8},${y} ${x},${y+9} ${x+8},${y}`},parent);
}
function drawLegend(target,series) {
  target.replaceChildren();
  series.forEach(item=>{const span=document.createElement("span");const icon=svgElement("svg",{viewBox:"0 0 24 24","aria-hidden":"true"},span);drawShape(icon,item,12,12,item.fill);span.append(document.createTextNode(item.label));target.append(span);});
}
function drawPlot(target,panel,raw,interactive,onChange) {
  target.replaceChildren();
  const width=Math.max(240,target.clientWidth),height=370,left=Math.min(210,Math.max(88,width*.24)),right=width,top=70,bottom=335;
  target.parentElement.style.setProperty("--comparison-width",left+"px");
  const min=panel.min??SETTINGS.min,max=panel.max??SETTINGS.max,tick=panel.tick??SETTINGS.tick;
  const y=value=>bottom-(value-min)/(max-min)*(bottom-top);
  const svg=svgElement("svg",{viewBox:`0 0 ${width} ${height}`,role:"group","aria-label":panel.section||panel.title||"Assigned study income"},target);
  if(panel.unit) svgElement("text",{transform:`translate(${left-68} ${(top+bottom)/2}) rotate(-90)`,"text-anchor":"middle","font-size":11,fill:"#596b79"},svg,panel.unit);
  for(let i=0;min+i*tick<=max+0.000001;i++) {
    const value=min+i*tick;
    svgElement("line",{x1:left,x2:right,y1:y(value),y2:y(value),stroke:Math.abs(value)<0.000001?"#788895":"#e4e8ec","stroke-width":Math.abs(value)<0.000001?1.5:1},svg);
    svgElement("text",{x:left-9,y:y(value)+4,"text-anchor":"end","font-size":12,fill:"#596b79"},svg,max>2?String(Math.round(value)):format(value));
  }
  const groupWidth=(right-left)/SETTINGS.windows.length;
  SETTINGS.windows.forEach((window,r)=>{
    const x=left+(r+.5)*groupWidth;
    svgElement("text",{x,y:48,"text-anchor":"middle","font-size":14,fill:"#344e62"},svg,window);
  });
  svgElement("text",{x:(left+right)/2,y:22,"text-anchor":"middle","font-size":13,fill:"#344e62"},svg,"Cumulative periods");
  const nodes=[];
  raw.forEach((value,i)=>{
    const r=Math.floor(i/panel.series.length),s=i%panel.series.length,series=panel.series[s];
    const spacing=Math.min(width<500?22:32,(groupWidth-8)/panel.series.length);
    const x=left+(r+.5)*groupWidth+(s-(panel.series.length-1)/2)*spacing;
    const label=`Periods ${SETTINGS.windows[r]}, ${series.label}`;
    const group=svgElement("g",interactive?{class:"handle",tabindex:0,role:"slider","aria-label":label,"aria-orientation":"vertical","aria-valuemin":min,"aria-valuemax":max}:{role:"img","aria-label":label},svg);
    const title=svgElement("title",{},group,label);
    if(interactive) svgElement("rect",{x:-spacing/2,y:-21,width:spacing,height:42,rx:4,fill:"transparent",class:"hit"},group);
    const symbol=drawShape(group,series,0,0,series.fill);
    nodes.push({group,symbol,title,x,label,series});
    if(!interactive) return;
    let drag=null;
    function pointValue(event) { const point=svg.createSVGPoint();point.x=event.clientX;point.y=event.clientY;const local=point.matrixTransform(svg.getScreenCTM().inverse());return min+(bottom-local.y)/(bottom-top)*(max-min); }
    function setValue(value) { onChange(i,value===null?"":format(Math.max(min,Math.min(max,Math.round(value*100)/100))),"marker"); }
    group.addEventListener("pointerdown",event=>{if(event.button!==0)return;event.preventDefault();group.focus();group.setPointerCapture(event.pointerId);const answer=parseAnswer(raw[i]);drag={id:event.pointerId,start:pointValue(event),value:answer.valid?answer.value:0};setValue(drag.value);});
    group.addEventListener("pointermove",event=>{if(drag&&drag.id===event.pointerId)setValue(drag.value+pointValue(event)-drag.start);});
    ["pointerup","pointercancel","lostpointercapture"].forEach(type=>group.addEventListener(type,event=>{if(drag&&drag.id===event.pointerId)drag=null;}));
    group.addEventListener("keydown",event=>{
      const parsed=parseAnswer(raw[i]);let value=parsed.valid?parsed.value:0;const step=event.shiftKey ? 0.1 : 0.01;
      if(event.key==="ArrowUp"||event.key==="ArrowRight")value+=step;
      else if(event.key==="ArrowDown"||event.key==="ArrowLeft")value-=step;
      else if(event.key==="Home")value=min;
      else if(event.key==="End")value=max;
      else if(event.key==="Delete"||event.key==="Backspace")value=null;
      else if(event.key!=="Enter"&&event.key!==" ")return;
      event.preventDefault();setValue(value);
    });
  });
  function refresh() {
    nodes.forEach((node,i)=>{
      const parsed=interactive?parseAnswer(raw[i]):{valid:raw[i]!==null,value:raw[i]};
      const value=parsed.valid?parsed.value:0;
      node.group.setAttribute("transform",`translate(${node.x},${y(value)})`);
      node.symbol.setAttribute("fill",parsed.valid?node.series.fill:"white");
      node.symbol.setAttribute("stroke-dasharray",parsed.valid?"none":"3 2");
      node.group.setAttribute("aria-valuenow",value);
      node.group.setAttribute("aria-valuetext",parsed.valid?(max>2?String(value):format(value)):"Not answered; starting position zero");
      node.title.textContent=node.label+": "+(parsed.valid?(max>2?String(value):format(value)):"not answered");
    });
  }
  refresh();return refresh;
}
function tableHTML(series,values,editable,prefix) {
  let html='<table class="estimate-table"><colgroup><col class="comparison-column"><col><col><col></colgroup><thead><tr><th scope="col" rowspan="2"><span class="sr-only">Comparison</span></th><th scope="colgroup" colspan="3">Cumulative periods</th></tr><tr>'+SETTINGS.windows.map(window=>'<th scope="col">'+window+'</th>').join("")+'</tr></thead><tbody>';
  series.forEach((s,c)=>{

    SETTINGS.windows.forEach((window,r)=>{

      html+='<td>'+(editable?'<input class="estimate" type="text" inputmode="decimal" autocomplete="off" id="'+prefix+'_'+i+'" data-cell="'+i+'" value="'+escapeHTML(values[i])+'" aria-label="Periods '+window+', '+escapeHTML(s.label)+'" aria-describedby="entryHelp">':(values[i]===null?'—':escapeHTML(prefix==="income"?values[i]:format(values[i]))))+'</td>';
    });html+='</tr>';
  });return html+'</tbody></table>';
}

function mountAnswerInterface(panel,raw,onUpdate) {
  // DOM rows are comparisons; response arrays remain indexed by window then comparison.
  const inputs=Array.from(screen.querySelectorAll(".estimate")).sort((a,b)=>Number(a.dataset.cell)-Number(b.dataset.cell));
  let refreshPlot;
  function update(index,value,source) {
    if(index!==undefined){raw[index]=value;inputs[index].value=value;}
    let answered=0,firstError="";
    inputs.forEach((input,i)=>{const parsed=parseAnswer(raw[i]);if(parsed.valid)answered++;if(parsed.error&&!firstError)firstError=`Periods ${SETTINGS.windows[Math.floor(i/panel.series.length)]}, ${panel.series[i%panel.series.length].short}: ${parsed.error}`;input.setAttribute("aria-invalid",parsed.error?"true":"false");input.setCustomValidity(parsed.error);});
    const status=document.getElementById("answerStatus");
    status.className="answer-status"+(firstError?" error":"");
    status.textContent=firstError;
    if(refreshPlot)refreshPlot();
    onUpdate({index,value,source,complete:answered===raw.length&&!firstError});persist();
  }
  inputs.forEach((input,i)=>{input.addEventListener("input",()=>update(i,input.value,"box"));input.addEventListener("blur",()=>{const parsed=parseAnswer(input.value);if(parsed.valid)update(i,format(parsed.value),"format");});});
  const target=document.getElementById("predictionPlot");
  function redraw(){refreshPlot=drawPlot(target,panel,raw,true,update);}
  redraw();drawLegend(document.getElementById("predictionLegend"),panel.series);update();
  resizeObserver=new ResizeObserver(redraw);resizeObserver.observe(target);
}

function commitPanel(panel) {
  // Navigation back must never resubmit or overwrite either saved round.
  if(state.browseIndex!==null||(state.phase==="revision"?state.revised:state.first)[panel.id])return;
  const raw=rawFor(panel),parsed=raw.map(parseAnswer);
  if(parsed.some(value=>!value.valid))return;
  const record={values:parsed.map(value=>value.value),savedAt:new Date().toISOString()};
  if(state.phase==="revision")state.revised[panel.id]=record;
  else if(!state.first[panel.id])state.first[panel.id]=record;
  state.index++;
  if(state.phase==="revision"&&state.index>=enabledPanels.length){state.phase="finished";state.finishedAt=new Date().toISOString();}
  persist();render();
}

    if(!state.first[panel.id])return;
    const first=state.first[panel.id].values,revised=state.revised[panel.id]?.values;
    html+=`<section class="summary-card"><h2>${escapeHTML(predictionTag(panel))}</h2>${proposalBadgeHTML(panel)}<p class="small muted">${escapeHTML(panel.section)} · ${escapeHTML(panel.unit)}${panel.draft?" · Proposed comparison":""}</p><div class="grid-wrap"><table class="summary-table"><thead><tr><th>Periods</th><th>Comparison</th><th>First</th>${includeRevised?"<th>Revised</th><th>Final</th>":""}</tr></thead><tbody>`;
    first.forEach((value,i)=>{
      const changed=revised&&revised[i]!==value;
      html+=`<tr${changed?' class="changed"':""}><td>${SETTINGS.windows[Math.floor(i/panel.series.length)]}</td><td>${escapeHTML(panel.series[i%panel.series.length].label)}</td><td>${format(value)}</td>${includeRevised?'<td>'+(revised?format(revised[i]):"—")+'</td><td>'+format(revised?revised[i]:value)+'</td>':""}</tr>`;
    });html+='</tbody></table></div></section>';
  });return html;
}
function exportData() {
  return {
    demo:true,specification:"Revising Sliders 10.12.26.docx",feedback:["Feedback Interface - Oct 14, 2026 LSC vs3.pdf","qualtrics_demo_2026_10_15, HS.pdf","qualtrics_demo_2026_10_15ddw.pdf"],version:SETTINGS.version,
    tutorial_completed_at:state.practice.completedAt,
    additional_information:{provided:!!SETTINGS.additionalInformation.trim(),text:SETTINGS.additionalInformation,seen_at:state.informationSeenAt},
    started_at:state.startedAt,finished_at:state.finishedAt,
    revision_requested:state.revisionRequested,revision_choice_at:state.revisionChoiceAt,
    windows:SETTINGS.windows,axis:{min:SETTINGS.min,max:SETTINGS.max,step:SETTINGS.step},
    panels:enabledPanels.map(panel=>({id:panel.id,document_label:panel.documentLabel||panel.id,title:panel.title,unit:panel.unitCode,unit_label:panel.unit,proposed:!!panel.draft,alternative_version:!!panel.alternative,proposal_version:panel.proposalVersion||null,proposal_label:panel.proposalLabel||null,contrasts:panel.series.map(s=>s.label),definition:panel.explanation,context:panel.context||null,first_saved_at:state.first[panel.id]?.savedAt||null,revised_saved_at:state.revised[panel.id]?.savedAt||null,
      responses:SETTINGS.windows.flatMap((window,r)=>panel.series.map((series,s)=>{
        const i=r*panel.series.length+s,first=state.first[panel.id]?.values[i]??null,second=state.revised[panel.id]?.values[i]??null;
        return {window,contrast:series.label,first,revised:second,final:second===null?first:second,changed:second===null?false:second!==first};
      }))
    }))
  };
}
function download(name,content,type) {
  const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvData(data) {
  const rows=[["panel_id","document_label","unit","proposed_contrast","reference_window","comparison","first_answer","revised_answer","final_answer","changed","revision_requested","first_saved_at","revised_saved_at","revision_choice_at","additional_information_provided","additional_information_seen_at"]];
  data.panels.forEach(panel=>panel.responses.forEach(response=>rows.push([panel.id,panel.document_label,panel.unit,panel.proposed,response.window,response.contrast,response.first,response.revised,response.final,response.changed,data.revision_requested,panel.first_saved_at,panel.revised_saved_at,data.revision_choice_at,data.additional_information.provided,data.additional_information.seen_at])));
  return '\ufeff'+rows.map(row=>row.map(value=>'"'+String(value??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
}
function renderSummary() {
  screen.innerHTML=`<div class="kicker">Demo complete</div><h1>Your predictions are ready to review</h1><p class="lead">Revision requested: <strong>${state.revisionRequested?"Yes":"No"}</strong>.</p><p>${state.revisionRequested?"The first and revised values are preserved separately. Changed predictions are highlighted below.":"Your first answers are the final answers. The revised-answer fields remain blank."}</p><div class="download-row"><button class="secondary" id="downloadCSV">Download answers (CSV)</button><button class="secondary" id="downloadJSON">Download full record (JSON)</button></div><p class="small muted">Downloads stay under your control. This demo has not sent answers to the study team or Qualtrics.</p>${summaryHTML(true)}`;
  document.getElementById("downloadCSV").onclick=()=>download("sspp-demo-answers.csv",csvData(exportData()),"text/csv;charset=utf-8");
  document.getElementById("downloadJSON").onclick=()=>download("sspp-demo-answers.json",JSON.stringify(exportData(),null,2),"application/json");
  setNavigation("",null,"You can go back to review the introduction, tutorial, and locked answers.");
}
function openDialog(title,html) {document.getElementById("dialogTitle").textContent=title;document.getElementById("dialogBody").innerHTML=html;dialog.showModal();}
document.getElementById("faqButton").onclick=()=>openDialog("FAQ & reference",`<div class="faq-body"><h2>What do the treatment arms mean?</h2><p>Control receives no study work. Stable receives fixed work. Predictable receives varying work with the schedule known in advance. Risky receives varying work revealed at the start of each period. Unstable pools Predictable and Risky.</p><h2>What do 1–2, 1–4, and 1–6 mean?</h2><p>They are cumulative reference windows: estimates use observations from the first two, first four, and all six two-week periods. Each longer window includes the earlier periods. Cumulative refers to the observations included, not to adding up the coefficients.</p><h2>Which units should I enter?</h2><p>Mental health uses standard deviations. Consumption is shown in three alternative versions: log points, standard deviations, and proportional changes. Read the units on the vertical axis and the explanation below the table. A 0.10 proportional change is 10%; 0.10 log points is approximately 10.5%.</p><h2>Does a positive mental-health value mean better health?</h2><p>In this draft, positive means better mental health in the named arm and negative means worse. The original description says the index combines stress and anxiety measures. The PIs still need to confirm the exact items, scoring, and standardization before fielding.</p><h2>Can I go back?</h2><p>Yes. Use Back to revisit earlier pages, including the tutorial. Unfinished entries are kept. Submitted prediction pages and the submitted revision decision are read-only. Use Return to current page to resume where you left off.</p><h2>What happens to my first answers?</h2><p>They lock when you continue. “First answers” is read-only. An additional-information page comes before the revision decision. Choosing to revise starts a separate round with copies of your first answers. Choosing not to revise leaves the second-answer fields empty.</p><h2>How do matched-calendar drafts work?</h2><p>The comparison holds assigned bags fixed in every period while comparing Predictable with Risky. Earlier and later schedules each have three 15-bag periods and three 3-bag periods; earlier puts at least two 15-bag periods in Periods 1–3, and later puts at least two in Periods 4–6. These proposed definitions and the matching rules remain for PI discussion; they do not establish separate effects of optimism or dread.</p><h2>What does the income reference show?</h2><p>It shows total bags implied by the work design: 54 assigned in Stable and Predictable, and 54 in expectation in Risky. It does not show actual earnings. The earlier illustrative GHC chart is omitted. Actual earnings, household income and consumption benchmarks, and compliance figures await PI input.</p><h2>What is included in the model?</h2><p>Community, cohort, and period fixed effects, as requested in the document. Exact matching rules and index standardization remain to be specified.</p><h2>Are my answers sent anywhere?</h2><p>No. They are saved in this browser tab where supported. Download CSV or JSON at the end to keep a copy. This prototype is not yet connected to Qualtrics.</p></div>`);
document.getElementById("reviewButton").onclick=()=>openDialog("Your locked first answers",'<p class="small muted">Read-only. The optional revision round records new values separately.</p>'+summaryHTML(false));
document.getElementById("closeDialog").onclick=()=>dialog.close();
document.getElementById("resetButton").onclick=()=>openDialog("Start a new demo?",'<p>This clears the answers stored for this demo in this browser tab. Download your completed answers first if you want to keep them.</p><button class="primary" id="confirmReset">Clear answers and restart</button>');
document.getElementById("dialogBody").addEventListener("click",event=>{if(event.target.id==="confirmReset"){state=newState();persist();dialog.close();render();}});
render();
</script>
</body>
